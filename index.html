  ["Arpaci-Dusseau, Operating Systems: Three Easy Pieces, 2018","https://pages.cs.wisc.edu/~remzi/OSTEP/"],
  ["Love, Linux Kernel Development, 3rd ed., Addison-Wesley 2010","https://www.pearson.com/en-us/subject-catalog/p/linux-kernel-development/P200000003346"]],

/* ===== 2 ===== */
{id:"os-scheduling",title:"Process and thread scheduling: FCFS, SJF, RR, MLFQ and CFS",level:3,kind:"Scheduling",status:"Runnable teaching lab",
 summary:"The scheduler picks the next thread to run. FCFS is fair but suffers the convoy effect. SJF minimizes mean waiting time. Round-robin gives every thread a slice. Priority scheduling needs aging. MLFQ adapts to interactive and batch workloads. Linux CFS uses a red-black tree keyed on virtual runtime.",
 mental:"A runqueue and a rule for who runs next",
 mentalText:"Each thread has a state and a priority or weight. The scheduler picks the runnable thread with the smallest virtual runtime or the highest priority.",
 problem:"Which scheduling policy fits a given workload and objective?",
 steps:["List the threads with arrival, burst and priority.","Choose the objective: mean waiting, mean response, throughput, fairness.","Choose the policy: FCFS, SJF, SRT, RR, priority, MLFQ or CFS.","Run the simulation and compute the metrics.","Compare against other policies.","Tune the quantum or the weight."],
 pseudo:"FCFS:  first come, first served\n  run in arrival order\n  convoy effect: a long job blocks everyone\n\nSJF (non-preemptive):\n  run the arrived job with the smallest burst\n  optimal for mean waiting time when all jobs are available\n\nSRT (preemptive SJF):\n  always run the job with the smallest remaining time\n  optimal for mean waiting with release dates\n\nRound-robin (quantum q):\n  FIFO queue, run the head for at most q, then requeue\n  good response time, overhead grows as q shrinks\n  q must be much larger than the context switch cost\n\nPriority:\n  run the highest-priority runnable thread\n  fixed priority starves low-priority threads\n  aging: priority_effective = base + alpha * waiting_time\n\nMultilevel feedback queue (MLFQ):\n  several queues with different quanta\n  new jobs enter the highest-priority queue\n  a job that uses its full quantum drops one level\n  a job that yields early stays at the same level\n  a periodic priority boost moves all jobs to the top\n  learns the job's behavior over time\n\nLinux CFS:\n  each task has a vruntime\n  vruntime advances inversely proportional to the weight\n  the scheduler always picks the smallest vruntime\n  the runqueue is a red-black tree keyed on vruntime\n  nice values map to weights:\n    nice = 0 -> 1024, nice = +1 -> 820, nice = -1 -> 1277\n  each nice step is roughly a 1.25x weight change\n  target latency and minimum granularity bound the slice\n\nScheduling metrics:\n  waiting time = completion - arrival - burst\n  turnaround time = completion - arrival\n  response time = first_run - arrival\n  throughput = jobs / total time\n  fairness:  Jain's index, max-min ratio",
 invariant:"Every scheduling policy optimizes some objective. No single policy is optimal for all objectives.",
 uses:"Every multitasking OS, hypervisor and real-time kernel.",
 strength:"Simple policies are easy to reason about. SJF and SRT are optimal for mean waiting. CFS is fair and scales.",
 limits:"SJF and SRT need to know the burst. RR has context-switch overhead. MLFQ needs tuning. CFS has no priority for latency.",
 pitfall:"Choosing RR with too small a quantum. The context-switch overhead dominates and throughput collapses. Choose q much larger than the switch cost.",
 question:"Why does SJF minimize mean waiting time when all jobs are available at time zero?",
 answer:"A short job before a long job delays only the long job. Swapping them delays both. By an exchange argument, sorting by shortest first minimizes the sum of waiting times.",
 demo:"os-scheduling",demoTitle:"FCFS, SJF, SRT, RR, priority, MLFQ",sample:"0 7 2\n2 4 1\n4 1 3\n5 4 2\n3",refs:[
  ["Silberschatz, Galvin, Gagne, Operating System Concepts, Chapter 5","https://www.os-book.com/"],
  ["Linux kernel documentation, CFS scheduler design","https://www.kernel.org/doc/html/latest/scheduler/sched-design-CFS.html"],
  ["Arpaci-Dusseau, Operating Systems: Three Easy Pieces, Chapter 7 (Scheduling)","https://pages.cs.wisc.edu/~remzi/OSTEP/"],
  ["Corbató et al., An experimental time-sharing system, AFIPS 1962","https://doi.org/10.1145/1460833.1460871"]],
 complexity:["FCFS: O(1) dispatch","SJF/SRT: O(n) or O(log n) with a heap","RR: O(1) dispatch","CFS: O(log n) per dispatch (red-black tree)"]},

/* ===== 3 ===== */
{id:"concurrency-basics",title:"Concurrency basics: mutexes, semaphores, monitors and atomics",level:3,kind:"Concurrency",status:"Runnable teaching lab",
 summary:"A critical section is code that must not run concurrently with another instance of itself. A mutex gives mutual exclusion. A semaphore generalizes to counting. A monitor bundles a lock with condition variables. Atomics give lock-free primitives.",
 mental:"A lock and a queue of waiters",
 mentalText:"A thread acquires the lock, enters the critical section, releases the lock. Waiters block on the lock or on a condition variable.",
 problem:"How do you protect shared state from concurrent access?",
 steps:["Identify the shared state and the critical sections.","Choose the primitive: mutex, semaphore, monitor or atomic.","Define the lock order if multiple locks are used.","Add condition variables for wait/notify.","Check the invariants that must hold.","Measure the throughput and the contention."],
 pseudo:"Race condition:\n  two threads access shared state\n  at least one writes\n  the interleaving determines the result\n\nCritical section:\n  mutual exclusion\n  progress (a thread outside the section cannot block others)\n  bounded waiting (a thread cannot wait forever)\n\nMutex (binary semaphore):\n  lock()    acquire, block if held\n  unlock()  release, wake a waiter\n  must be released by the same thread that acquired it\n\nSemaphore:\n  S is an integer >= 0\n  P(S) or wait(S):  block while S == 0; S = S - 1\n  V(S) or signal(S):  S = S + 1; wake a waiter\n  binary semaphore:  S in {0, 1}\n  counting semaphore:  S >= 0\n  can be released by a different thread than the one that acquired it\n\nMonitor:\n  a mutex plus condition variables\n  only one thread is active in the monitor at a time\n  condition variables:  wait(cv) releases the lock and blocks\n                        signal(cv) wakes one waiter\n                        broadcast(cv) wakes all waiters\n  the woken thread must reacquire the lock\n  used in Java (synchronized), C# (lock), and Mesa-style languages\n\nAtomic operations:\n  compare-and-swap (CAS):  if *p == old then *p = new; return success\n  test-and-set (TAS):  set *p to 1 and return the old value\n  fetch-and-add (FAA):  return the old value and add delta\n  load-acquire, store-release for memory ordering\n\nMemory ordering:\n  relaxed:  no ordering guarantee\n  acquire:  no later operation moves before it\n  release:  no earlier operation moves after it\n  sequentially consistent:  a total order on all operations\n\nSpurious wakeups:\n  a wait can return without a signal\n  always recheck the condition in a while loop\n  while (!condition) wait(cv);\n\nLock granularity:\n  coarse-grained:  one lock for a large data structure\n  fine-grained:  one lock per bucket or per element\n  fine-grained scales better but risks deadlock\n\nLock-free:\n  use CAS loops instead of locks\n  progress is guaranteed by at least one thread\n  wait-free:  every thread makes progress in a bounded number of steps\n  ABA problem:  a value changes A -> B -> A, CAS succeeds unexpectedly\n  fix:  tagged pointers or hazard pointers",
 invariant:"A lock protects an invariant. Every access to the shared state must hold the lock. A condition variable must be waited on in a loop.",
 uses:"Every multi-threaded program, kernel subsystem and concurrent data structure.",
 strength:"Mutexes and semaphores are simple and widely supported. Monitors make condition synchronization ergonomic. Atomics enable lock-free structures.",
 limits:"Locks can deadlock, convoy and starve. Fine-grained locks are hard to get right. Lock-free code is very hard to verify.",
 pitfall:"Waiting on a condition variable with an if instead of a while. A spurious wakeup or a signal from another thread's condition lets the thread proceed with a false condition.",
 question:"Why must a condition variable wait be inside a while loop?",
 answer:"Spurious wakeups and signals for other conditions can wake the thread when its predicate is still false. The while loop rechecks the predicate and waits again if needed. This is the standard Mesa semantics.",
 demo:"concurrency-basics",demoTitle:"Mutex, semaphore and condition variable timeline",sample:"T1 lock\nT1 critical\nT2 lock\nT1 unlock\nT2 critical\nT2 unlock\nT1 wait\nT2 signal\nT1 wake",refs:[
  ["Dijkstra, Cooperating sequential processes, 1965","https://www.cs.utexas.edu/users/EWD/transcriptions/EWD01/EWD123.html"],
  ["Hoare, Monitors: an operating system structuring concept, CACM 1974","https://doi.org/10.1145/355620.361161"],
  ["Herlihy, Shavit, The Art of Multiprocessor Programming, 2nd ed., Morgan Kaufmann 2020","https://www.sciencedirect.com/book/9780124159501/the-art-of-multiprocessor-programming"],
  ["Arpaci-Dusseau, Operating Systems: Three Easy Pieces, Chapters 28-31","https://pages.cs.wisc.edu/~remzi/OSTEP/"]],
 complexity:["Mutex lock/unlock: tens of nanoseconds uncontended","Contended lock: microseconds (context switch)","Atomic CAS: a few nanoseconds","Semaphore: same as a mutex plus a counter"]},

/* ===== 4 ===== */
{id:"mutual-exclusion",title:"Mutual exclusion algorithms: Peterson, bakery, ticket locks and CAS",level:4,kind:"Mutual exclusion",status:"Runnable teaching lab",
 summary:"Mutual exclusion algorithms guarantee that at most one thread is in the critical section. Peterson and Dekker work for two threads. Lamport's bakery and ticket locks work for n threads. CAS and TAS are the hardware primitives that make modern locks possible.",
 mental:"A flag, a turn variable, or a ticket number",
 mentalText:"Each thread announces its intent and waits until it is its turn. The bakery algorithm hands out tickets and serves them in order.",
 problem:"How do you guarantee mutual exclusion without a hardware lock?",
 steps:["State the mutual exclusion, progress and bounded-waiting requirements.","Choose the algorithm: Peterson, Dekker, bakery, ticket lock or a CAS-based lock.","Prove the three properties.","Check the memory ordering requirements.","Measure the contention and the fairness.","Choose the primitive for the target hardware."],
 pseudo:"Peterson's algorithm (two threads, i and j):\n  flag[i] = true\n  turn = j\n  while (flag[j] && turn == j):  wait\n  critical section\n  flag[i] = false\n  works for two threads\n  requires sequential consistency\n\nDekker's algorithm (two threads):\n  flag[i] = true\n  while (flag[j]):\n    if (turn == j):\n      flag[i] = false\n      while (turn == j):  wait\n      flag[i] = true\n  critical section\n  flag[i] = false\n  turn = j\n  the first correct mutual exclusion algorithm\n\nLamport's bakery algorithm (n threads):\n  choosing[i] = true\n  number[i] = 1 + max(number[0..n-1])\n  choosing[i] = false\n  for j in 0..n-1:\n    while choosing[j]:  wait\n    while number[j] != 0 and\n          (number[j], j) < (number[i], i):  wait\n  critical section\n  number[i] = 0\n  works for n threads, first-come-first-served\n\nTicket lock:\n  next_ticket = 0\n  now_serving = 0\n  lock:    my = fetch_and_add(next_ticket, 1)\n           while now_serving != my:  wait\n  unlock:  now_serving = now_serving + 1\n  FIFO fairness, one cache line per lock\n  contended lock causes cache-line ping-pong\n\nTest-and-set (TAS):\n  lock:    while test_and_set(&lock):  wait\n  unlock:  lock = 0\n  simple but not fair (no bounded waiting)\n\nCompare-and-swap (CAS):\n  lock:    while !compare_and_swap(&lock, 0, 1):  wait\n  unlock:  lock = 0\n  the base primitive for many lock-free structures\n\nTest-and-test-and-set:\n  spin on a read of the lock, then TAS only when it looks free\n  reduces cache traffic compared to plain TAS\n\nMCS lock:\n  a queue-based lock, one node per waiting thread\n  each thread spins on its own local flag\n  no cache-line contention\n  O(1) space per thread, FIFO fairness\n\nMemory ordering:\n  Peterson and bakery need sequentially consistent memory\n  on weakly ordered hardware, insert fences or use acquire/release",
 invariant:"A correct mutual exclusion algorithm satisfies mutual exclusion, progress and bounded waiting. On weakly ordered hardware it must also use the correct fences.",
 uses:"Kernel locks, user-space locks, lock-free data structures and any concurrent program.",
 strength:"Peterson and bakery are simple and provably correct. Ticket locks are FIFO and cache-friendly. MCS locks scale well.",
 limits:"Peterson and bakery are impractical for large n. Ticket locks suffer from cache-line contention. TAS is unfair.",
 pitfall:"Implementing Peterson's algorithm on a weakly ordered CPU without fences. The compiler and the CPU can reorder the stores, breaking the proof.",
 question:"Why is a ticket lock fair but a TAS lock unfair?",
 answer:"A ticket lock hands out tickets in order and serves them in order, so a thread is guaranteed to acquire the lock after a bounded number of other threads. A TAS lock lets any waiting thread grab the lock first, so a thread can starve indefinitely.",
 demo:"mutual-exclusion",demoTitle:"Peterson, bakery, ticket lock and TAS/CAS",sample:"peterson T1 T2 3\nbakery T1 T2 T3 4\nticket T1 T2 T3 5\ntas T1 T2 3",refs:[
  ["Peterson, Myths about the mutual exclusion problem, Information Processing Letters 1981","https://doi.org/10.1016/0020-0190(81)90106-X"],
  ["Lamport, A new solution of Dijkstra's concurrent programming problem, CACM 1974","https://doi.org/10.1145/361082.361093"],
  ["Mellor-Crummey, Scott, Algorithms for scalable synchronization on shared-memory multiprocessors, ACM TOCS 1991","https://doi.org/10.1145/103727.103729"],
  ["Herlihy, Shavit, The Art of Multiprocessor Programming, Chapters 2 and 7","https://www.sciencedirect.com/book/9780124159501/the-art-of-multiprocessor-programming"]],
 complexity:["Peterson: O(1) per lock/unlock","Bakery: O(n) per lock","Ticket lock: O(1) per lock/unlock","MCS lock: O(1) per lock/unlock with a per-thread node"]},

/* ===== 5 ===== */
{id:"deadlocks",title:"Deadlocks: conditions, prevention, avoidance, detection and Banker's algorithm",level:4,kind:"Deadlocks",status:"Runnable teaching lab",
 summary:"A deadlock is a cycle of threads each waiting for a resource held by another. The four necessary conditions are mutual exclusion, hold and wait, no preemption and circular wait. Prevention removes one condition. Avoidance uses a safe-state check. Detection finds cycles and recovers.",
 mental:"A cycle in a resource-allocation graph",
 mentalText:"Each thread holds some resources and waits for others. A cycle means no thread can proceed. Banker's algorithm checks whether granting a request leaves a safe state.",
 problem:"How do you prevent, avoid, detect or recover from deadlocks?",
 steps:["List the resources, their instances and the current allocation.","Build the resource-allocation graph.","Apply prevention, avoidance, detection or recovery.","For avoidance, run the safety check before granting.","For detection, look for a cycle.","For recovery, choose a victim and roll it back."],
 pseudo:"Four necessary conditions (Coffman):\n  1. mutual exclusion:  a resource is held exclusively\n  2. hold and wait:  a thread holds a resource and waits for another\n  3. no preemption:  a resource cannot be taken away\n  4. circular wait:  a cycle of threads each waiting for the next\n\nPrevention:\n  break mutual exclusion:  make the resource shareable (not always possible)\n  break hold and wait:  request all resources at once\n  break no preemption:  preempt and roll back\n  break circular wait:  impose a global order on resources\n\nResource-allocation graph:\n  process -> resource (request edge)\n  resource -> process (assignment edge)\n  a cycle with single instances means deadlock\n  a cycle with multiple instances may or may not mean deadlock\n\nAvoidance (Banker's algorithm):\n  state:\n    Available[j]         instances of resource j free\n    Max[i][j]            max demand of process i for resource j\n    Allocation[i][j]     currently allocated\n    Need[i][j] = Max - Allocation\n  safety check:\n    Work = Available\n    Finish[i] = false for all i\n    while there is i with Finish[i] == false and Need[i] <= Work:\n      Work = Work + Allocation[i]\n      Finish[i] = true\n    if all Finish[i] are true:  safe state\n  resource request:\n    if Request[i] <= Need[i] and Request[i] <= Available:\n      tentatively allocate\n      run the safety check\n      if safe:  commit the allocation\n      else:  roll back and wait\n\nDetection:\n  build the wait-for graph (processes only)\n  look for a cycle\n  periodically or on demand\n  recovery:  kill a victim, roll it back, release its resources\n\nRecovery:\n  process termination:  kill one or more processes\n  resource preemption:  take a resource, roll back the holder\n  choose a victim by cost:  priority, runtime, resources held\n\nStarvation:\n  a thread never gets a resource because others always win\n  fix:  aging or fair queuing",
 invariant:"A deadlock requires all four Coffman conditions. Removing any one prevents deadlock. A safe state guarantees no deadlock, but an unsafe state does not necessarily deadlock.",
 uses:"Operating systems, database lock managers, thread pools and any system with shared resources.",
 strength:"Banker's algorithm gives a precise safety guarantee. Prevention is simple. Detection lets the system run with fewer restrictions.",
 limits:"Banker's algorithm needs advance knowledge of maximum demand. Prevention can be wasteful. Detection and recovery lose work.",
 pitfall:"Assuming an unsafe state means a deadlock. An unsafe state means the system cannot guarantee that all processes finish, but the actual execution may still avoid deadlock.",
 question:"Why does a cycle in the wait-for graph of single-instance resources imply deadlock?",
 answer:"Each edge means the process is waiting for a resource held by the next process. A cycle means each process waits for the next and the last waits for the first. No process can release a resource, so none can proceed. The system is deadlocked.",
 demo:"deadlocks",demoTitle:"Resource-allocation graph, Banker's safety check and detection",sample:"5 3\nP0 7 5 3\nP1 3 2 2\nP2 9 0 2\nP3 2 2 2\nP4 4 3 3\n\nalloc\nP0 0 1 0\nP1 2 0 0\nP2 3 0 2\nP3 2 1 1\nP4 0 0 2\n\navail\n3 3 2\n\nrequest\nP1 1 0 2",refs:[
  ["Dijkstra, Cooperating sequential processes, 1965 (Banker's algorithm)","https://www.cs.utexas.edu/users/EWD/transcriptions/EWD01/EWD123.html"],
  ["Coffman, Elphick, Shoshani, System deadlocks, ACM Computing Surveys 1971","https://doi.org/10.1145/356586.356588"],
  ["Holt, Some deadlock properties of computer systems, ACM Computing Surveys 1972","https://doi.org/10.1145/356603.356607"],
  ["Silberschatz, Galvin, Gagne, Operating System Concepts, Chapter 8","https://www.os-book.com/"]],
 complexity:["Banker's safety check: O(n^2 * m) for n processes and m resources","Cycle detection: O(V + E)","Prevention: O(1) extra work per request","Detection interval: trade-off between CPU and lost work"]},

/* ===== 6 ===== */
{id:"alloc-basics",title:"Memory layout and allocation basics: stack, heap and fragmentation",level:3,kind:"Allocation",status:"Runnable teaching lab",
 summary:"A process has a text segment, a data segment, a heap and a stack. The heap allocator hands out blocks and reclaims them. Fragmentation wastes memory. First-fit, best-fit and worst-fit are the classic placement policies.",
 mental:"A heap with free and allocated blocks",
 mentalText:"The allocator walks the free list and picks a block for each request. Freeing a block returns it to the free list and coalesces with neighbors.",
 problem:"How does a heap allocator place and reclaim blocks?",
 steps:["Fix the block layout: header, payload, footer or boundary tag.","Maintain a free list.","Apply a placement policy: first-fit, best-fit or worst-fit.","Split a block if it is larger than the request.","Coalesce adjacent free blocks on free.","Measure the fragmentation."],
 pseudo:"Process memory layout (low to high address):\n  text    code, read-only, executable\n  data    initialized globals\n  bss     uninitialized globals, zero-filled\n  heap    grows up, brk/mmap\n  ...\n  stack   grows down, one per thread\n\nBlock layout:\n  header:  size, in-use flag, link to the next block\n  payload:  the user data\n  footer (optional):  size, for coalescing backwards\n  boundary tags:  header + footer, allow O(1) coalescing\n\nPlacement policies:\n  first-fit:   scan the free list, take the first block that fits\n               fast, can fragment the front of the list\n  best-fit:    take the smallest block that fits\n               reduces leftover space, can leave tiny fragments\n  worst-fit:   take the largest block\n               leaves a large remainder, rarely used in practice\n  next-fit:    like first-fit, but start from the last placement\n\nSplitting:\n  if block.size >= request + MIN_SPLIT:\n    allocate request from the front\n    return the remainder to the free list\n  else:\n    allocate the whole block\n\nCoalescing:\n  on free, check the previous and next blocks\n  if free, merge into one larger block\n  boundary tags make this O(1)\n\nFragmentation:\n  internal:  allocated block is larger than the request\n  external:  free memory is split into small non-contiguous blocks\n  measure:  largest free block / total free memory\n\nAllocator performance:\n  throughput:  number of requests per second\n  utilization:  fraction of the heap that is payload\n\nCommon heap allocators:\n  dlmalloc (Doug Lea)\n  ptmalloc (glibc)\n  jemalloc (Facebook)\n  tcmalloc (Google)\n  mimalloc (Microsoft)\n  each uses size classes, per-thread caches and arenas",
 invariant:"An allocator must never hand out a block that is in use. It must never lose a free block. Coalescing keeps fragmentation bounded.",
 uses:"Every program that allocates memory: C, C++, Rust, the kernel, runtimes.",
 strength:"First-fit is fast. Best-fit reduces leftover space. Boundary tags make coalescing O(1).",
 limits:"All policies suffer from fragmentation. Best-fit can leave many tiny fragments. No policy is optimal for every workload.",
 pitfall:"Using best-fit for every allocation. It scans the whole free list and can leave many tiny unusable fragments. Use segregated free lists or a size-class allocator instead.",
 question:"Why does internal fragmentation happen?",
 answer:"The allocator hands out a block that is larger than the request, for example because the block must be aligned or because the size class is coarser than the request. The unused bytes are wasted. The waste is internal to the allocated block.",
 demo:"alloc-basics",demoTitle:"First-fit, best-fit, worst-fit and fragmentation",sample:"64 128 32 256 64 96 128 48\n\nalloc 100\nalloc 50\nalloc 200\nfree 0\nalloc 80",refs:[
  ["Wilson et al., Dynamic storage allocation: a survey and critical review, IWMM 1995","https://doi.org/10.1007/3-540-60368-9_19"],
  ["Knuth, The Art of Computer Programming, Volume 1, Section 2.5 (Dynamic Storage Allocation)","https://www.informit.com/store/art-of-computer-programming-volume-1-fundamental-9780201896831"],
  ["Berger, McKinley, Blumofe, Wilson, Hoard: a scalable memory allocator for multithreaded applications, ASPLOS 2000","https://doi.org/10.1145/378993.379232"],
  ["Evans, jemalloc: a scalable concurrent malloc(3) implementation, 2006","https://people.freebsd.org/~jasone/jemalloc/bsdcan2006/jemalloc.pdf"]],
 complexity:["First-fit: O(free list) worst case","Best-fit: O(free list)","Worst-fit: O(free list)","Coalescing with boundary tags: O(1)"]},

/* ===== 7 ===== */
{id:"kernel-allocators",title:"Kernel allocators: buddy system, slab, TLSF, arenas and pools",level:4,kind:"Kernel allocators",status:"Runnable teaching lab",
 summary:"The kernel cannot use a general-purpose heap for everything. The buddy system allocates power-of-two blocks and coalesces them efficiently. Slab and SLUB cache frequently used object types. TLSF gives O(1) allocation. Per-CPU arenas reduce contention.",
 mental:"Power-of-two blocks, object caches and per-CPU pools",
 mentalText:"The buddy system splits large blocks into halves to satisfy a request and merges them back on free. The slab allocator pre-builds objects of the same type and hands them out from a freelist.",
 problem:"How does the kernel allocate memory efficiently under high concurrency and with many object types?",
 steps:["Choose the abstraction: pages (buddy), objects (slab) or general blocks (TLSF).","Set up the free lists per order (buddy) or per size class (TLSF).","Add per-CPU caches to reduce contention.","Handle the slow path when the cache is empty.","Reclaim memory under pressure (shrinker, reclaim).","Measure the fragmentation and the throughput."],
 pseudo:"Buddy system:\n  maintain free lists for each order k (block size 2^k pages)\n  allocate(n):\n    find the smallest k with 2^k >= n\n    if the free list for k is empty, split a block of order k+1\n    repeat until a block is available\n    return the block\n  free(block, k):\n    if the buddy of block is free, merge into order k+1\n    repeat\n  buddy(block) = block XOR (1 << k)\n  O(log n) allocation, low external fragmentation\n\nSlab allocator:\n  one cache per object type (inode, dentry, task_struct, ...)\n  a cache has slabs (contiguous pages)\n  a slab holds objects of the same size\n  per-CPU freelists for fast allocation\n  objects are constructed and destroyed with a constructor\n  on free, the object goes back to the slab freelist\n  shrinks the cache under memory pressure\n  SLUB is the modern Linux implementation\n  SLOB is a small-footprint allocator for embedded systems\n\nTLSF (Two-Level Segregated Fit):\n  two-level bitmap of free lists\n  first level:  power of two (log2 of the size)\n  second level:  linear subdivision\n  O(1) allocation and free\n  bounded fragmentation\n  used in real-time systems and many embedded kernels\n\nSegregated free lists:\n  one free list per size class\n  allocation:  round up to the next size class, pop from that list\n  free:  push back to the size class\n  fast, but internal fragmentation per size class\n  used by dlmalloc, jemalloc, tcmalloc\n\nArenas:\n  a pool of memory managed by one allocator instance\n  one arena per thread reduces lock contention\n  rebalancing moves memory between arenas\n  used by jemalloc and tcmalloc\n\nMemory pools:\n  a fixed-size pool of preallocated objects\n  allocation is O(1) from a freelist\n  no fragmentation within the pool\n  used in kernels, network stacks and game engines\n\nPage reclaim:\n  page cache, anonymous memory, slab shrinkers\n  LRU lists:  active and inactive\n  reclaim frees the least recently used pages\n  swappiness controls the balance between page cache and anonymous memory\n\nPer-CPU caches:\n  each CPU has a local cache of free objects\n  allocation hits the local cache first\n  the slow path refills the cache from the global pool\n  reduces cache-line contention on the global freelist",
 invariant:"A kernel allocator must be fast, bounded in its worst case, and safe under interrupts and concurrency. It must not fragment unpredictably.",
 uses:"Linux kernel, Windows kernel, embedded RTOSes, hypervisors and any kernel that manages physical memory.",
 strength:"Buddy is simple and coalesces well. Slab reuses objects and amortizes construction. TLSF gives O(1) with bounded fragmentation. Per-CPU caches scale.",
 limits:"Buddy suffers internal fragmentation for non-power-of-two requests. Slab caches grow and need shrinking. TLSF needs tuning of the size classes.",
 pitfall:"Using kmalloc for large allocations. The buddy system may split and coalesce many blocks. Use vmalloc or a dedicated pool for large or long-lived allocations.",
 question:"Why does the buddy system use XOR to find the buddy of a block?",
 answer:"Blocks at order k are aligned to 2^k. The buddy of a block at address b is b XOR 2^k, which flips the bit that distinguishes the two halves of the parent block. This makes the buddy lookup a single XOR operation.",
 demo:"kernel-allocators",demoTitle:"Buddy system, slab and TLSF allocation",sample:"buddy 6\n40 100 20 200 60 8\n\nslab\ninode 20\ndentry 15\ntask_struct 5\n\nalloc\ninode\ndentry\ninode",refs:[
  ["Knowlton, A fast storage allocator, CACM 1965 (buddy system)","https://doi.org/10.1145/365628.365640"],
  ["Bonwick, The slab allocator: an object-caching kernel memory allocator, USENIX 1994","https://www.usenix.org/publications/library/proceedings/bos94/full_papers/bonwick.ps"],
  ["Masmano et al., TLSF: a new dynamic memory allocator for real-time systems, ECRTS 2004","https://doi.org/10.1109/EMRTS.2004.1311009"],
  ["Gorman, Understanding the Linux Virtual Memory Manager, Prentice Hall 2004","https://www.kernel.org/doc/gorman/"]],

/* ===== 8 ===== */
{id:"virtual-memory",title:"Virtual memory: paging, page tables, multilevel tables and the TLB",level:4,kind:"Virtual memory",status:"Runnable teaching lab",
 summary:"Virtual memory gives each process a private address space. The MMU translates virtual addresses to physical addresses using page tables. A TLB caches recent translations. Multilevel page tables save space for sparse address spaces.",
 mental:"A virtual address split into a page number and an offset",
 mentalText:"The CPU sends a virtual address to the MMU. The MMU looks up the page table, finds the physical frame and combines it with the offset. The TLB caches the result.",
 problem:"How does the hardware translate a virtual address to a physical address?",
 steps:["Split the virtual address into a page number and an offset.","Walk the page table:  one level or many.","Combine the physical frame number with the offset.","Cache the translation in the TLB.","Handle a TLB miss by walking the page table.","Handle a page fault by loading the page from disk."],
 pseudo:"Paging:\n  virtual address = (VPN, offset)\n  physical address = (PFN, offset)\n  page size = 2^offset_bits, typically 4 KB\n  VPN = virtual address / page_size\n  offset = virtual address % page_size\n\nPage table:\n  one entry per virtual page\n  entry:  PFN, valid, dirty, accessed, permissions, present\n  a flat table for a 32-bit address space with 4 KB pages\n    has 2^20 entries, about 4 MB per process\n  too large for a 64-bit address space\n\nMultilevel page tables:\n  64-bit address split into several indices and an offset\n  x86-64 with 4 KB pages:  4 levels (PML4, PDPT, PD, PT)\n  each level has 512 entries (9 bits)\n  48-bit virtual address:  9 + 9 + 9 + 9 + 12 = 48 bits\n  only the populated subtrees are allocated\n  page-table walk:  4 memory accesses per translation\n\nInverted page table:\n  one entry per physical frame\n  the entry stores the (pid, VPN) that maps to it\n  a hash table finds the entry\n  used in some architectures (PowerPC, IA-64)\n\nTLB (translation lookaside buffer):\n  a small fully associative or set-associative cache\n  typically 32-1024 entries\n  hit:  1 cycle, no page-table walk\n  miss:  walk the page table, then insert\n  TLB shootdown:  invalidate an entry on all CPUs\n  ASID or PCID tags avoid a full flush on context switch\n  huge pages reduce TLB pressure\n\nPage fault:\n  the page is not present in memory\n  the CPU traps to the kernel\n  the kernel finds the page on disk or allocates a zero page\n  the kernel updates the page table\n  the kernel returns and the instruction is retried\n  minor fault:  page is in memory but not mapped\n  major fault:  page must be read from disk\n\nDemand paging:\n  load a page only on first access\n  the working set is the set of pages a process uses\n  thrashing:  the working set exceeds the frames available\n\nCopy-on-write:\n  fork() shares the parent pages, marked read-only\n  a write triggers a fault, the kernel copies the page\n  saves memory and time\n\nSegmentation:\n  a segment is a variable-size region (code, data, stack)\n  a logical address is (segment, offset)\n  the segment table maps to a base and a limit\n  used in x86 protected mode and in some embedded systems",
 invariant:"The MMU translates every memory access. The translation must be correct and consistent across all CPUs. A stale TLB entry gives the wrong physical address.",
 uses:"Every modern general-purpose CPU and OS. Virtual memory is the foundation of isolation and demand paging.",
 strength:"Isolation, demand paging, memory-mapped files, copy-on-write and sparse address spaces all follow from virtual memory.",
 limits:"Page-table walks cost memory accesses. A TLB miss is expensive. Multilevel tables save space but add latency.",
 pitfall:"Forgetting to flush the TLB after changing a page table entry. A stale entry lets the CPU use the old translation, giving a wrong or unsafe physical address.",
 question:"Why does a multilevel page table save memory?",
 answer:"A flat table needs an entry for every virtual page, even the huge unused regions of the address space. A multilevel table allocates a level only if some page in that range is mapped. For a sparse address space, the savings are enormous.",
 demo:"virtual-memory",demoTitle:"Page-table walk, TLB hit ratio and page fault cost",sample:"tlb 64 0.95\nlevels 4\naddr 0x1A2B3C4D\nfault 0.0001",refs:[
  ["Silberschatz, Galvin, Gagne, Operating System Concepts, Chapter 9","https://www.os-book.com/"],
  ["Intel 64 and IA-32 Architectures Software Developer's Manual, Volume 3A (Paging)","https://www.intel.com/content/www/us/en/developer/articles/technical/intel-sdm.html"],
  ["Jacob, Mudge, Virtual memory: issues of implementation, IEEE Computer 1998","https://doi.org/10.1109/2.683013"],
  ["Arpaci-Dusseau, Operating Systems: Three Easy Pieces, Chapter 18 (Paging)","https://pages.cs.wisc.edu/~remzi/OSTEP/"]],
 complexity:["Single-level page table: O(1) lookup, huge memory","Multilevel page table: 4 memory accesses on x86-64","TLB hit: 1 cycle","TLB miss: 10-100 cycles","Page fault: microseconds (minor) to milliseconds (major)"]},

/* ===== 9 ===== */
{id:"page-replacement",title:"Page replacement: FIFO, LRU, Clock, WSClock and Belady's anomaly",level:4,kind:"Page replacement",status:"Runnable teaching lab",
 summary:"When memory is full, the OS evicts a page. FIFO is simple but can evict a hot page. LRU approximates the working set. Clock and Second-Chance approximate LRU with a reference bit. WSClock tracks the working set. Belady's anomaly shows that FIFO can fault more with more frames.",
 mental:"A circular buffer of frames and a reference bit",
 mentalText:"The OS walks the frames, checks the reference bit and evicts the first unreferenced page. WSClock also checks the age of the page against the working-set window.",
 problem:"Which page should be evicted when memory is full?",
 steps:["Choose the policy: FIFO, LRU, Clock, NRU, LFU or WSClock.","Track the per-page metadata: age, reference bit, use count.","On a fault, choose a victim.","Evict the victim, write it back if dirty.","Load the requested page.","Measure the fault rate and the working-set size."],
 pseudo:"FIFO:\n  maintain a queue of pages in load order\n  evict the head on a fault\n  simple, suffers Belady's anomaly\n\nOptimal (Belady's MIN):\n  evict the page used furthest in the future\n  requires future knowledge\n  a theoretical benchmark\n\nLRU:\n  evict the least recently used page\n  good locality, no Belady's anomaly\n  exact LRU needs a timestamp per access, too expensive\n\nClock (Second-Chance):\n  a circular list of frames with a reference bit\n  on a fault, advance the hand\n  if the reference bit is 1, set it to 0 and advance\n  if the reference bit is 0, evict this frame\n  approximates LRU with one bit per frame\n\nNRU (Not Recently Used):\n  reference bit and dirty bit give four classes\n  evict from the lowest non-empty class\n  simple, low overhead\n\nLFU (Least Frequently Used):\n  evict the page with the smallest use count\n  can keep old pages forever\n  aging:  halve the counts periodically\n\nWSClock:\n  Clock + working-set window\n  a page is in the working set if its age < tau\n  on a fault, advance the hand\n  if the reference bit is 1, set it to 0\n  if the age < tau and not dirty, advance\n  if the age >= tau and clean, evict\n  if the age >= tau and dirty, schedule a write and advance\n  good for both locality and writeback\n\nWorking set:\n  W(t, tau) = the set of pages referenced in [t - tau, t]\n  the size of the working set tracks the locality\n  if the sum of working sets exceeds the frames, thrash\n\nBelady's anomaly:\n  FIFO can fault more with more frames\n  example:  reference string 1 2 3 4 1 2 5 1 2 3 4 5\n  with 3 frames:  9 faults\n  with 4 frames:  10 faults\n  LRU and Optimal do not exhibit the anomaly\n  the anomaly is a property of the algorithm, not the workload\n\nThrashing:\n  the working set exceeds the frames available\n  the system spends more time paging than computing\n  fix:  reduce the multiprogramming level, add memory, use a better policy\n\nFrame allocation:\n  equal allocation:  each process gets the same number of frames\n  proportional allocation:  frames proportional to the process size\n  working-set based:  allocate enough for the working set\n  page-fault frequency:  adjust to keep the fault rate in a band",
 invariant:"A replacement policy decides which page leaves memory. A good policy keeps the working set resident. A bad policy causes thrashing.",
 uses:"Every OS with demand paging, every hypervisor and every database buffer pool.",
 strength:"LRU approximates the optimal policy for workloads with locality. Clock gives a cheap approximation. WSClock handles writeback and the working set together.",
 limits:"Exact LRU is expensive. Clock and WSClock need tuning of the hand and tau. FIFO can exhibit Belady's anomaly.",
 pitfall:"Using FIFO in a system with strong locality. FIFO can evict the hottest page. Use LRU, Clock or WSClock instead.",
 question:"Why does Belady's anomaly occur in FIFO but not in LRU?",
 answer:"FIFO's eviction order depends only on load order, which changes when the number of frames changes. A page that was evicted early with 3 frames may survive longer with 4 frames and then be re-evicted later, causing an extra fault. LRU's stack property guarantees that the set of pages in memory with k frames is a subset of the set with k+1 frames, so more frames never cause more faults.",
 demo:"page-replacement",demoTitle:"FIFO, LRU, Clock, WSClock and Belady's anomaly",sample:"1 2 3 4 1 2 5 1 2 3 4 5\n3",refs:[
  ["Belady, A study of replacement algorithms for a virtual-storage computer, IBM Systems Journal 1966","https://doi.org/10.1147/sj.52.0078"],
  ["Carr, Hennessy, WSClock: a clock algorithm for working set paging, 1981","https://doi.org/10.1145/800221.806704"],
  ["Corbató, A paging experiment with the Multics system, 1969","https://doi.org/10.7551/mitpress/10395.003.0009"],
  ["Denning, Working sets past and present, IEEE TSE 1980","https://doi.org/10.1109/TSE.1980.230467"]],
 complexity:["FIFO: O(1) per fault","LRU: O(1) with a hash map and a linked list","Clock: O(1) amortized per fault","WSClock: O(1) amortized per fault","Optimal: O(future) per fault"]},

/* ===== 10 ===== */
{id:"protection-sharing",title:"Memory protection and sharing: COW, mmap, shared memory and ASLR",level:4,kind:"Protection and sharing",status:"Runnable teaching lab",
 summary:"Page permissions enforce read, write and execute protection. Copy-on-write shares pages until a write. Memory-mapped files map a file into the address space. Shared memory lets processes share pages. ASLR randomizes the layout to hinder exploits.",
 mental:"A page table entry with permission bits and a shared flag",
 mentalText:"The MMU checks the permission bits on every access. A write to a read-only page traps. The kernel then either copies the page or terminates the process.",
 problem:"How does the OS protect memory and share it safely?",
 steps:["Set the page permissions: read, write, execute, user, kernel.","Mark shared pages with a reference count.","On a write to a COW page, copy and update the mapping.","For mmap, map file pages into the address space.","For shared memory, map the same physical frames into multiple processes.","Randomize the base addresses for ASLR."],
 pseudo:"Page permissions (x86-64 PTE bits):\n  P    present\n  R/W  read-only or read-write\n  U/S  user or supervisor\n  NX   no-execute\n  A    accessed\n  D    dirty\n\nProtection fault:\n  the CPU checks the permission bits on every access\n  a violation traps to the kernel\n  the kernel sends SIGSEGV to the process or handles the fault\n\nCopy-on-write (COW):\n  fork() marks the parent pages read-only and increments a refcount\n  a write by either process triggers a protection fault\n  the kernel copies the page, marks both writable, decrements the refcount\n  used by fork, mmap MAP_PRIVATE and snapshots\n\nMemory-mapped files:\n  mmap(addr, length, prot, flags, fd, offset)\n  maps file pages into the address space\n  MAP_SHARED:  writes go to the file and are visible to other mappers\n  MAP_PRIVATE:  writes are COW and stay local\n  page cache backs the mapping\n  used for executables, libraries and large data files\n\nShared memory:\n  shm_open + mmap MAP_SHARED, or shmget + shmat\n  the same physical frames map into multiple processes\n  the fastest IPC, no kernel copy\n  needs external synchronization (semaphores, futexes)\n\nASLR (Address Space Layout Randomization):\n  randomize the base of the stack, heap, mmap region and libraries\n  the executable itself can be PIE (position-independent)\n  hinders ROP and return-to-libc attacks\n  entropy is limited by the address-space size\n  combined with NX, stack canaries and CFI\n\nmprotect:\n  change the permissions of a mapped region\n  used for guard pages, JIT and stack growth\n\nGuard pages:\n  an unmapped page next to a stack or a heap\n  a stack overflow hits the guard page and traps\n\nMemory tagging:\n  ARM MTE, SPARC ADI, x86 LAM\n  a tag per allocation and per pointer\n  a mismatch traps on access\n  catches use-after-free and buffer overflows",
 invariant:"Every access is checked against the permission bits. A shared page must be reference-counted. A COW page must be copied before the first write.",
 uses:"Every OS, every sandbox, every process isolation mechanism and every memory-safe runtime.",
 strength:"Permissions give fine-grained protection. COW and mmap save memory and time. Shared memory is the fastest IPC. ASLR raises the cost of exploitation.",
 limits:"Permission checks add complexity. COW faults cost time. Shared memory needs explicit synchronization. ASLR has limited entropy.",
 pitfall:"Forgetting to flush the TLB after changing page permissions. The CPU can use a stale writable mapping after mprotect(read-only) and let a write through.",
 question:"How does copy-on-write make fork() fast?",
 answer:"fork() does not copy the address space. It marks the parent pages read-only, increments a reference count and gives the child the same mappings. A write by either process triggers a fault, and only then is the single page copied. For a process that forks and calls exec, most pages are never written and never copied.",
 demo:"protection-sharing",demoTitle:"COW, mmap, shared memory and ASLR",sample:"COW 3\nmmap 2\nshm 2\nASLR 28",refs:[
  ["Silberschatz, Galvin, Gagne, Operating System Concepts, Chapter 9 (Protection)","https://www.os-book.com/"],
  ["Smith, Maguire, Implementing precise exceptions in an imprecise architecture, 1999","https://doi.org/10.1109/12.752634"],
  ["Shacham, The geometry of innocent flesh on the bone: return-into-libc without function calls, CCS 2007","https://doi.org/10.1145/1315245.1315313"],
  ["Serebryany et al., Memory tagging: a new era of memory safety, 2018","https://doi.org/10.1145/3297858.3304042"]],
 complexity:["Page permission check: 0 extra cycles (done by the MMU)","Protection fault: hundreds of nanoseconds","COW copy: one page copy per written page","mmap: O(1) per page on demand","ASLR entropy: 28-32 bits on x86-64"]},

/* ===== 11 ===== */
{id:"garbage-collection",title:"Garbage collection: refcount, mark-sweep, copying and generational",level:4,kind:"Garbage collection",status:"Runnable teaching lab",
 summary:"A garbage collector reclaims objects that are no longer reachable. Reference counting frees on the last reference but cannot handle cycles. Mark-sweep traces from the roots and frees unreachable objects. Copying collectors move live objects and compact memory. Generational collectors exploit the weak generational hypothesis.",
 mental:"A graph of objects rooted at the stack and globals",
 mentalText:"The collector walks the graph from the roots, marks the reachable objects and frees the rest. A copying collector moves the live objects to a new region and leaves the garbage behind.",
 problem:"How does a runtime reclaim memory that is no longer in use?",
 steps:["Identify the roots: stack, registers, globals, thread-local storage.","Choose the algorithm: refcount, mark-sweep, copying or generational.","Trace or count references to find the live set.","Reclaim the unreachable objects.","Compact or move objects to reduce fragmentation.","Run the collector concurrently or incrementally to bound the pause."],
 pseudo:"Reference counting:\n  each object has a count of references\n  on assign:  incref(new), decref(old)\n  on decref to 0:  free the object and decref its children\n  immediate reclamation\n  cannot collect cycles\n  fix:  cycle collector or weak references\n  used by CPython, Swift, Objective-C (ARC)\n\nMark-sweep:\n  mark phase:  trace from the roots and mark every reachable object\n  sweep phase:  walk the heap and free the unmarked objects\n  stop-the-world unless done concurrently\n  no object movement, so no pointer updates\n  fragmentation accumulates\n\nMark-compact:\n  mark phase:  as in mark-sweep\n  compact phase:  slide the live objects together\n  updates all pointers\n  no fragmentation, but a longer pause\n\nCopying collector (Cheney):\n  the heap is split into two semispaces:  from and to\n  allocate in the from space\n  when full, trace from the roots and copy live objects to the to space\n  update all pointers\n  swap the spaces\n  the cost is proportional to the live set, not the heap\n  no fragmentation\n  uses 2x the memory\n  good for short-lived objects\n\nGenerational GC:\n  weak generational hypothesis:  most objects die young\n  young generation:  small, collected often (minor GC)\n  old generation:  large, collected rarely (major GC)\n  promotion:  objects that survive a few minor GCs move to the old gen\n  write barrier:  track old-to-young pointers\n  card table:  a byte per card (for example 512 bytes)\n  used by HotSpot, V8, .NET, Go\n\nTri-color marking (incremental/concurrent):\n  white:  not yet visited\n  gray:   visited but children not scanned\n  black:  visited and children scanned\n  invariant:  no black object points to a white object\n  write barrier:  shade the white object gray on a black-to-white store\n  used by concurrent collectors\n\nCollection triggers:\n  allocation threshold\n  explicit System.gc() (a hint)\n  time-based\n  memory pressure\n\nStop-the-world pauses:\n  proportional to the live set for a copying collector\n  proportional to the heap for a mark-sweep collector\n  concurrent collectors move most work off the pause\n\nFinalizers:\n  run before an object is freed\n  unpredictable timing\n  discouraged; use try-with-resources or explicit close",
 invariant:"A collector must never free a reachable object. A collector must eventually free unreachable objects. A concurrent collector must maintain the tri-color invariant with a write barrier.",
 uses:"Java, C#, Go, Python, JavaScript, Ruby, OCaml and any managed runtime.",
 strength:"Automatic memory management removes a whole class of bugs. Generational collectors exploit the common case. Copying collectors are fast when most objects die young.",
 limits:"Stop-the-world pauses are unpredictable. Reference counting cannot collect cycles. Copying uses 2x memory. Write barriers cost on every store.",
 pitfall:"Relying on finalizers for correctness. Finalizers run at an unpredictable time and may never run. Use explicit resource management instead.",
 question:"Why does a copying collector cost less when most objects die young?",
 answer:"The cost of a copying collection is proportional to the number of live objects, not the total heap. If most objects are garbage, only a small number are copied. The garbage is left behind and the semispaces are swapped. This is why the copying collector pairs well with the generational hypothesis.",
 demo:"garbage-collection",demoTitle:"Reference counting, mark-sweep, copying and generational",sample:"roots R1 R2\nedges\nR1 -> A\nA -> B\nB -> C\nR2 -> D\nD -> E\nE -> D\n\ncycles\nD E",refs:[
  ["McCarthy, Recursive functions of symbolic expressions and their computation by machine, CACM 1960","https://doi.org/10.1145/367177.367199"],
  ["Cheney, A nonrecursive list compacting algorithm, CACM 1970","https://doi.org/10.1145/362790.362798"],
  ["Ungar, Generation scavenging: a non-disruptive high performance storage reclamation algorithm, SIGSOFT 1984","https://doi.org/10.1145/800020.808261"],
  ["Jones, Hosking, Moss, The Garbage Collection Handbook, 2nd ed., CRC Press 2023","https://gchandbook.org/"]],
 complexity:["Reference counting: O(1) per assign, no pause","Mark-sweep: O(heap) per collection","Copying: O(live set) per collection","Generational minor GC: O(young live set)","Tri-color concurrent: O(heap) spread over time"]},

/* ===== 12 ===== */
{id:"modern-gc",title:"Modern GC and runtimes: concurrent, incremental, G1, ZGC and Shenandoah",level:5,kind:"Modern GC",status:"Runnable teaching lab",
 summary:"Modern collectors aim for low pause times and high throughput. Concurrent collectors run alongside the mutator. Incremental collectors split the work into small steps. G1 uses region-based collection. ZGC and Shenandoah use colored pointers or forwarding pointers to keep pauses under a millisecond.",
 mental:"Concurrent mark threads running alongside the application threads",
 mentalText:"The collector marks objects concurrently with the application. A write barrier catches mutator updates. The pause is short because most work is done off the critical path.",
 problem:"How do you collect garbage without long stop-the-world pauses?",
 steps:["Choose the goal: low pause, high throughput or low footprint.","Choose the collector: concurrent, incremental, region-based or colored-pointer.","Add the write barrier:  card table, snapshot-at-the-beginning or incremental-update.","Run the mark phase concurrently with the mutator.","Pause briefly for the root scan and the final mark.","Compact or evacuate concurrently.","Measure the pause distribution and the throughput."],
 pseudo:"Concurrent mark-sweep (CMS, HotSpot):\n  initial mark (STW):  mark the roots\n  concurrent mark:  trace the graph while the mutator runs\n  remark (STW):  catch up on the changes\n  concurrent sweep:  free the unmarked objects\n  no compaction, so fragmentation accumulates\n  write barrier:  card table or snapshot-at-the-beginning\n\nIncremental update:\n  the collector marks in small slices between mutator work\n  write barrier shades the old value gray\n  maintains the tri-color invariant\n\nSnapshot-at-the-beginning (SATB):\n  the collector marks everything reachable at the start of the cycle\n  write barrier shades the overwritten value\n  keeps floating garbage but is simpler\n\nG1 (Garbage-First, HotSpot):\n  the heap is split into many equal-size regions\n  a region is young, old, humongous or free\n  young collections:  copy the young regions to survivor regions\n  mixed collections:  collect the young plus the most garbage-rich old regions\n  the collection set is chosen by the garbage-first heuristic\n  remembered sets:  a per-region list of incoming references\n  SATB write barrier\n  predictable pause target:  -XX:MaxGCPauseMillis\n  stop-the-world pauses are short but frequent\n\nZGC (HotSpot, Java 11+):\n  colored pointers:  the low bits of the pointer store the state\n  load barriers:  the mutator fixes the pointer on load\n  concurrent mark, concurrent relocate, concurrent remap\n  regions of 2 MB (or more)\n  pauses are sub-millisecond, independent of the heap size\n  supports heaps up to many terabytes\n\nShenandoah (OpenJDK):\n  similar goals to ZGC\n  Brooks forwarding pointers for concurrent evacuation\n  load-reference barrier\n  concurrent mark, concurrent evacuation, concurrent update references\n  short pauses independent of the heap size\n\nEpsilon GC (no-op):\n  allocates but never collects\n  for benchmarking and short-lived jobs\n\nWrite barriers:\n  card table:  mark the card dirty on a store, scan dirty cards\n  remembered set:  track old-to-young pointers per region\n  SATB:  shade the overwritten reference\n  load barrier:  fix a colored pointer on load (ZGC, Shenandoah)\n  cost:  a few instructions per store\n\nEscape analysis:\n  the compiler proves an object does not escape a method\n  the object is allocated on the stack or its fields are scalarized\n  reduces the allocation rate\n  no collection needed for the escaped-free objects\n\nRegion-based collectors:\n  G1:  regions of 1-32 MB\n  ZGC:  regions of 2 MB or more\n  generational G1:  young and old regions\n  collect the garbage-rich regions first\n\nPause-time targets:\n  G1:  10-200 ms\n  ZGC:  < 1 ms\n  Shenandoah:  < 10 ms\n  throughput vs pause:  lower pause costs throughput\n\nTuning:\n  heap size, young size, region size, pause target\n  threads for concurrent marking and evacuation\n  measure, do not guess",
 invariant:"A concurrent collector must maintain the tri-color invariant with a write barrier. A load barrier must fix a colored pointer before the mutator uses it.",
 uses:"HotSpot (Java), OpenJDK, .NET, Go, V8, Dart and any runtime with a low-pause requirement.",
 strength:"Concurrent collectors keep pauses short. G1 balances throughput and pause. ZGC and Shenandoah give sub-millisecond pauses on huge heaps.",
 limits:"Concurrent collectors cost throughput. Write barriers cost on every store. Colored pointers cost memory bandwidth. Tuning is complex.",
 pitfall:"Choosing ZGC for every Java workload. ZGC is excellent for very large heaps and strict pause requirements, but it uses more memory and CPU than G1. For small heaps with a relaxed pause budget, G1 is often faster.",
 question:"How does a colored pointer in ZGC let the mutator fix a reference on load?",
 answer:"The low bits of the pointer store the object's state (remapped, marked, forwarded). A load barrier checks the bits and, if the object has moved, updates the pointer to the new address before the mutator uses it. This lets the collector relocate objects concurrently without stopping the mutator.",
 demo:"modern-gc",demoTitle:"G1 regions, ZGC colored pointers and pause targets",sample:"heap 4096\nregion 2\nyoung 512\nold 3584\npause 1\nGC 1\nGC 2\nGC 3",refs:[
  ["Detlefs et al., Garbage-first garbage collection, ISMM 2004","https://doi.org/10.1145/1029873.1029879"],
  ["ZGC: a scalable low-latency garbage collector, OpenJDK","https://wiki.openjdk.org/display/zgc/Main"],
  ["Shenandoah GC, OpenJDK","https://wiki.openjdk.org/display/shenandoah/Main"],
  ["Tene, Iyengar, Wolf, C4: the continuously concurrent compacting collector, ISMM 2011","https://doi.org/10.1145/1993478.1993495"]],
 complexity:["G1 young GC: pause proportional to the young live set","G1 mixed GC: pause bounded by the pause target","ZGC: sub-millisecond pause independent of heap size","Shenandoah: pause bounded by the root set size","Write barrier: 1-5 instructions per store"]},

{id:"io-scheduling",title:"Storage and I/O scheduling: SSTF, SCAN, C-SCAN, LOOK and DMA",level:3,kind:"I/O scheduling",status:"Runnable teaching lab",
 summary:"The I/O scheduler reorders disk requests to minimize seek time. SSTF picks the nearest request. SCAN sweeps back and forth. C-SCAN sweeps in one direction and jumps back. LOOK and C-LOOK stop at the last request. DMA moves data without CPU involvement. Interrupt-driven I/O notifies the CPU on completion.",
 mental:"A disk head moving across a set of requests",
 mentalText:"The head moves from cylinder to cylinder. The scheduler orders the requests to reduce the total movement. SCAN sweeps to the end and reverses; C-SCAN jumps back without servicing.",
 problem:"How do you order a set of disk requests to minimize seek time?",

 pseudo:"Disk geometry:\n  platter, track, cylinder, sector\n  seek time:  move the head to the target track\n  rotational latency:  wait for the sector to rotate under the head\n  transfer time:  read the bytes\n  total = seek + rotational + transfer\n\nFCFS:\n  serve in arrival order\n  fair, but a long seek can follow a short one\n\nSSTF (Shortest Seek Time First):\n  pick the request closest to the current head position\n  minimizes the next seek\n  can starve far requests\n\nSCAN (elevator):\n  sweep in one direction, serving every request on the way\n  reverse at the last track\n  no starvation, bounded wait\n\nC-SCAN:\n  sweep in one direction\n  when the end is reached, jump back to the start without servicing\n  more uniform wait times than SCAN\n\nLOOK:\n  like SCAN, but reverse at the last request, not the last track\n\nC-LOOK:\n  like C-SCAN, but jump back to the first request, not the last track\n\nChoosing a policy:\n  FCFS:  fairness\n  SSTF:  throughput on a lightly loaded disk\n  SCAN/C-SCAN:  heavy load, no starvation\n  LOOK/C-LOOK:  like SCAN/C-SCAN but less travel\n\nDMA (Direct Memory Access):\n  the device transfers data to or from memory without the CPU\n  the CPU sets up the transfer and is interrupted on completion\n  frees the CPU for other work\n  reduces the interrupt rate compared to programmed I/O\n\nInterrupt-driven I/O:\n  the CPU issues the I/O command\n  the device signals an interrupt on completion\n  the CPU handles the interrupt and continues\n  fine-grained control, more interrupts\n\nProgrammed I/O (PIO):\n  the CPU copies each word from or to the device\n  simple, slow, wastes CPU cycles\n\nModern storage:\n  SSDs have no moving parts, no seek time\n  the scheduler still matters for queue depth and fairness\n  NVMe supports deep queues and parallel I/O\n  multi-queue schedulers:  blk-mq (Linux)\n  schedulers:  none (NVMe), mq-deadline, BFQ, Kyber\n\nI/O queues:\n  a queue of pending requests\n  the scheduler reorders the queue\n  the device driver submits requests to the device\n  completion is handled by an interrupt or a poll\n\nRead-ahead:\n  the OS prefetches sequential blocks\n  reduces the effective latency for sequential reads\n\nWrite-back vs write-through:\n  write-back:  write to the cache, flush later\n  write-through:  write to the device immediately\n  write-back is faster, write-through is safer",

{id:"advanced-memory",title:"Advanced systems memory: NUMA, huge pages, false sharing and memory ordering",level:5,kind:"Advanced memory",status:"Runnable teaching lab",
 summary:"NUMA systems give each CPU a local memory. Placement determines the latency. Huge pages reduce TLB pressure. False sharing makes unrelated variables contend on the same cache line. Memory ordering determines which reorderings are allowed. Lock-free allocation and memory reclamation close the loop.",

 pseudo:"NUMA (Non-Uniform Memory Access):\n  each socket has a memory controller and local DRAM\n  a CPU accesses local memory in ~80 ns\n  a CPU accesses remote memory in ~140 ns (1.5-2x)\n  the OS places each page on a node\n  first-touch policy:  the page is placed on the node of the first writer\n  interleave:  round-robin pages across nodes\n  bind:  all pages on a chosen node\n  migrate:  move pages to the node of the accessing CPU\n  numa_balancing in Linux\n\nHuge pages:\n  4 KB pages:  many TLB entries needed for a large working set\n  2 MB pages:  512x fewer TLB entries\n  1 GB pages:  262144x fewer TLB entries\n  transparent huge pages (THP) in Linux\n  explicit hugetlbfs for dedicated use\n  trade-off:  internal fragmentation for small allocations\n\nCache hierarchy:\n  L1:  32-64 KB, 4-5 cycles\n  L2:  256 KB - 1 MB, 10-15 cycles\n  L3:  8-64 MB, 40-70 cycles\n  DRAM:  tens of GB, 80-200 ns\n  cache line:  64 bytes on x86, 128 on some ARM\n\nFalse sharing:\n  two threads write to two variables on the same cache line\n  the cache line ping-pongs between cores\n  fix:  pad the variables to a full cache line\n  alignas(64) or padding in C/C++\n  @Contended in Java\n\nMemory ordering:\n  relaxed (x86 TSO):  loads can be reordered with loads\n  ARM and POWER:  weaker, loads and stores can reorder\n  acquire:  no later operation moves before it\n  release:  no earlier operation moves after it\n  seq_cst:  a total order on all operations\n  fences:  mfence, sfence, lfence on x86; dmb on ARM\n  use atomics with the correct ordering\n\nLock-free allocation:\n  a lock-free freelist uses CAS to pop and push\n  ABA problem:  a value changes A -> B -> A, CAS succeeds incorrectly\n  fix:  tagged pointers (low bits) or hazard pointers\n  per-thread caches avoid the shared freelist\n\nMemory reclamation:\n  hazard pointers:  a thread publishes the pointer it is using\n  the reclaimer waits until no hazard pointer references the object\n  epoch-based reclamation:  a global epoch, threads announce their epoch\n  RCU (read-copy-update):  readers are wait-free, writers defer the free\n  used in the Linux kernel and in lock-free libraries\n\nNUMA-aware allocation:\n  numactl --membind, --cpunodebind, --interleave\n  mbind, set_mempolicy in Linux\n  first-touch for parallel initialization\n\nPerformance checklist:\n  measure the NUMA hit rate\n  check the TLB miss rate\n  check the cache miss rate\n  check the false-sharing rate\n  check the memory-ordering cost",

"# FCFS, SJF, SRT, RR, priority scheduling",
"from collections import deque",
"",
"jobs = [",
"    {'id': 'P1', 'arrival': 0, 'burst': 7, 'priority': 2},",
"    {'id': 'P2', 'arrival': 2, 'burst': 4, 'priority': 1},",
"    {'id': 'P3', 'arrival': 4, 'burst': 1, 'priority': 3},",
"    {'id': 'P4', 'arrival': 5, 'burst': 4, 'priority': 2},",
"]",
"",
"def run_nonpreemptive(jobs, key):",
"    S = [dict(j, remaining=j['burst'], completion=None) for j in jobs]",
"    t, done, order = 0, 0, []",
"    while done < len(S):",
"        avail = [s for s in S if s['arrival'] <= t and s['completion'] is None]",
"        if not avail:",
"            t = min(s['arrival'] for s in S if s['completion'] is None)",
"            continue",
"        pick = sorted(avail, key=key)[0]",
"        t += pick['burst']",
"        pick['completion'] = t",
"        order.append(pick['id'])",
"        done += 1",
"    return S, order",
"",
"def stats(S):",
"    n = len(S)",
"    wait = sum(s['completion'] - s['arrival'] - s['burst'] for s in S) / n",
"    turn = sum(s['completion'] - s['arrival'] for s in S) / n",
"    return wait, turn",
"",
"for name, key in [",
"    ('FCFS',     lambda s: (s['arrival'], s['id'])),",
"    ('SJF',      lambda s: (s['burst'], s['id'])),",
"    ('Priority', lambda s: (s['priority'], s['id'])),",
"]:",
"    S, order = run_nonpreemptive(jobs, key)",
"    w, t = stats(S)",
"    print(f'{name:10s} order={order}  wait={w:.2f}  turnaround={t:.2f}')",
"",
"# Round-robin",
"def run_rr(jobs, quantum=2):",
"    S = [dict(j, remaining=j['burst'], completion=None) for j in jobs]",
"    q = deque()",
"    arrived = [False] * len(S)",
"    t, done = 0, 0",
"    while done < len(S):",
"        for i, s in enumerate(S):",
"            if not arrived[i] and s['arrival'] <= t:",
"                arrived[i] = True",
"                q.append(s)",
"        if not q:",
"            t += 1",
"            continue",
"        s = q.popleft()",
"        run = min(quantum, s['remaining'])",
"        s['remaining'] -= run",
"        t += run",
"        if s['remaining'] == 0:",
"            s['completion'] = t",
"            done += 1",
"        else:",
"            for i, x in enumerate(S):",
"                if not arrived[i] and x['arrival'] <= t:",
"                    arrived[i] = True",
"                    q.append(x)",
"            q.append(s)",
"    return S",
"",
"S = run_rr(jobs, quantum=2)",
"w, t = stats(S)",
"print(f'RR(q=2)    wait={w:.2f}  turnaround={t:.2f}')"
].join("\n");

"# Peterson, bakery, ticket lock and TAS/CAS simulations",
"import threading, time",
"",
"# Peterson's algorithm (two threads)",
"flag = [False, False]",
"turn = 0",
"peterson_count = [0, 0]",
"",
"def peterson(i, j, n):",
"    global turn",
"    for _ in range(n):",
"        flag[i] = True",
"        turn = j",
"        while flag[j] and turn == j:",
"            pass",
"        peterson_count[i] += 1",
"        flag[i] = False",
"",
"t1 = threading.Thread(target=peterson, args=(0, 1, 1000))",
"t2 = threading.Thread(target=peterson, args=(1, 0, 1000))",
"t1.start(); t2.start()",
"t1.join(); t2.join()",
"print('peterson counts:', peterson_count)",
"",
"# Ticket lock",
"next_ticket = 0",
"now_serving = 0",
"ticket_lock = threading.Lock()",
"ticket_count = 0",
"",
"def ticket_worker(n):",
"    global next_ticket, now_serving, ticket_count",
"    for _ in range(n):",
"        with ticket_lock:",
"            my = next_ticket",
"            next_ticket += 1",
"        while now_serving != my:",
"            pass",
"        ticket_count += 1",
"        now_serving += 1",
"",
"t1 = threading.Thread(target=ticket_worker, args=(1000,))",
"t2 = threading.Thread(target=ticket_worker, args=(1000,))",
"t1.start(); t2.start()",
"t1.join(); t2.join()",
"print('ticket counter:', ticket_count)",
"",
"# Lamport's bakery (n threads, simplified with a lock for the max)",
"bakery_lock = threading.Lock()",
"number = [0, 0, 0]",
"choosing = [False, False, False]",

"    global bakery_count",

"# Banker's algorithm safety check",
"def bankers(available, max_need, allocation):",
"    n = len(max_need)",
"    m = len(available)",
"    need = [[max_need[i][j] - allocation[i][j] for j in range(m)] for i in range(n)]",
"    work = available[:]",
"    finish = [False] * n",
"    sequence = []",
"    while len(sequence) < n:",
"        found = False",
"        for i in range(n):",
"            if not finish[i] and all(need[i][j] <= work[j] for j in range(m)):",
"                for j in range(m):",
"                    work[j] += allocation[i][j]",
"                finish[i] = True",
"                sequence.append(i)",
"                found = True",
"                break",
"        if not found:",
"            break",
"    return all(finish), sequence, need",
"",
"available = [3, 3, 2]",
"max_need = [[7, 5, 3], [3, 2, 2], [9, 0, 2], [2, 2, 2], [4, 3, 3]]",
"allocation = [[0, 1, 0], [2, 0, 0], [3, 0, 2], [2, 1, 1], [0, 0, 2]]",
"",
"safe, seq, need = bankers(available, max_need, allocation)",
"print('Need matrix:')",
"for i, row in enumerate(need):",

"print('Safe?', safe)",
"print('Safe sequence:', ['P' + str(i) for i in seq])",

"# First-fit, best-fit, worst-fit and coalescing",
"class Block:",
"    def __init__(self, start, size, free=True):",
"        self.start = start",
"        self.size = size",
"        self.free = free",
"",
"def first_fit(blocks, request):",
"    for b in blocks:",
"        if b.free and b.size >= request:",
"            return b",
"    return None",
"",
"def best_fit(blocks, request):",
"    best = None",
"    for b in blocks:",
"        if b.free and b.size >= request:",
"            if best is None or b.size < best.size:",
"                best = b",
"    return best",
"",
"def worst_fit(blocks, request):",
"    best = None",
"    for b in blocks:",
"        if b.free and b.size >= request:",
"            if best is None or b.size > best.size:",
"                best = b",
"    return best",
"",
"def allocate(blocks, request, policy):",
"    b = policy(blocks, request)",
"    if b is None:",
"        return False",
"    if b.size > request:",
"        newb = Block(b.start + request, b.size - request, free=True)",
"        b.size = request",
"        blocks.insert(blocks.index(b) + 1, newb)",
"    b.free = False",
"    return True",
"",
"blocks = [Block(0, 64, True), Block(64, 128, True), Block(192, 32, True), Block(224, 256, True)]",
"print('Initial free blocks:', [(b.start, b.size) for b in blocks if b.free])",
"for policy, name in [(first_fit, 'first-fit'), (best_fit, 'best-fit'), (worst_fit, 'worst-fit')]:",
"    b2 = [Block(x.start, x.size, x.free) for x in blocks]",
"    allocate(b2, 100, policy)",
"    free = [(x.start, x.size) for x in b2 if x.free]",
"    print(f'{name:10s} after alloc(100): free = {free}')",
"",
"# Fragmentation measure",
"def fragmentation(blocks):",
"    free = [b.size for b in blocks if b.free]",
"    if not free:",
"        return 0",
"    return max(free) / sum(free)",
"",
"print('fragmentation:', fragmentation(blocks))"
].join("\n");

"# Buddy system allocator",
"class Buddy:",
"    def __init__(self, total_pages, min_order=0):",
"        self.max_order = total_pages.bit_length() - 1",
"        self.min_order = min_order",
"        self.free = {k: [] for k in range(self.min_order, self.max_order + 1)}",
"        self.free[self.max_order].append(0)",
"    def allocate(self, order):",
"        for k in range(order, self.max_order + 1):",
"            if self.free[k]:",
"                block = self.free[k].pop()",
"                while k > order:",
"                    k -= 1",
"                    buddy = block ^ (1 << k)",
"                    self.free[k].append(buddy)",
"                return block, order",
"        return None",
"    def free_block(self, block, order):",
"        while order < self.max_order:",
"            buddy = block ^ (1 << order)",
"            if buddy in self.free[order]:",
"                self.free[order].remove(buddy)",
"                block = min(block, buddy)",
"                order += 1",
"            else:",
"                break",
"        self.free[order].append(block)",
"",
"b = Buddy(64)",
"print('orders:', list(b.free.keys()))",
"for order in [3, 2, 1, 0]:",
"    blk = b.allocate(order)",
"    print(f'allocate order {order}: block={blk}')",

"# FIFO, LRU, Clock, Optimal and Belady's anomaly",
"from collections import deque, OrderedDict",
"",
"def fifo(refs, frames):",
"    mem = deque()",
"    faults = 0",
"    for r in refs:",
"        if r not in mem:",
"            if len(mem) == frames:",
"                mem.popleft()",
"            mem.append(r)",
"            faults += 1",
"    return faults",
"",
"def lru(refs, frames):",
"    mem = OrderedDict()",
"    faults = 0",
"    for r in refs:",
"        if r in mem:",
"            mem.move_to_end(r)",
"        else:",
"            if len(mem) == frames:",
"                mem.popitem(last=False)",
"            mem[r] = True",
"            faults += 1",
"    return faults",
"",
"def clock(refs, frames):",
"    mem = [None] * frames",
"    ref_bit = [0] * frames",
"    hand = 0",
"    faults = 0",
"    for r in refs:",
"        if r in mem:",
"            ref_bit[mem.index(r)] = 1",
"            continue",
"        faults += 1",
"        while ref_bit[hand] == 1:",
"            ref_bit[hand] = 0",
"            hand = (hand + 1) % frames",
"        mem[hand] = r",
"        ref_bit[hand] = 1",
"        hand = (hand + 1) % frames",
"    return faults",
"",
"def optimal(refs, frames):",
"    mem = []",
"    faults = 0",
"    for i, r in enumerate(refs):",
"        if r in mem:",
"            continue",
"        faults += 1",
"        if len(mem) < frames:",
"            mem.append(r)",
"        else:",
"            farthest, victim = -1, None",
"            for m in mem:",
"                try:",
"                    nxt = refs.index(m, i + 1)",
"                except ValueError:",
"                    nxt = float('inf')",
"                if nxt > farthest:",
"                    farthest, victim = nxt, m",
"            mem.remove(victim)",
"            mem.append(r)",
"    return faults",
"",
"refs = [1, 2, 3, 4, 1, 2, 5, 1, 2, 3, 4, 5]",
"print('Belady anomaly with FIFO:')",
"for f in [3, 4]:",
"    print(f'  frames={f}: FIFO faults={fifo(refs, f)}  LRU={lru(refs, f)}  Optimal={optimal(refs, f)}')",
"",
"print('Clock vs LRU:')",
"for f in [3, 4, 5]:",
"    print(f'  frames={f}: Clock={clock(refs, f)}  LRU={lru(refs, f)}')"
].join("\n");

"def mark_sweep(roots, edges):",
"    marked = set()",
"    stack = list(roots)",

"        n = stack.pop()",

"# FCFS, SSTF, SCAN, C-SCAN, LOOK, C-LOOK",
"def fcfs(requests, head):",
"    return sum(abs(b - a) for a, b in zip([head] + requests, requests))",
"",
"def sstf(requests, head):",
"    reqs = sorted(requests)",
"    total = 0",
"    cur = head",
"    while reqs:",
"        nearest = min(reqs, key=lambda x: abs(x - cur))",
"        total += abs(nearest - cur)",
"        cur = nearest",
"        reqs.remove(nearest)",
"    return total",
"",
"def scan(requests, head, end=200):",
"    left = sorted([r for r in requests if r < head], reverse=True)",
"    right = sorted([r for r in requests if r >= head])",
"    total = 0",
"    if left:",
"        total += head - left[-1]",
"    if left and right:",
"        total += right[-1] - left[-1]",
"    elif right:",
"        total += right[-1] - head",
"    return total",
"",
"def cscan(requests, head, end=200):",
"    left = sorted([r for r in requests if r < head], reverse=True)",
"    right = sorted([r for r in requests if r >= head])",
"    total = 0",
"    if right:",
"        total += right[-1] - head",
"    total += end - (right[-1] if right else head)",
"    total += end",
"    if left:",
"        total += left[0]",
"    return total",
"",
"def look(requests, head, direction='up'):",
"    left = sorted([r for r in requests if r < head], reverse=True)",
"    right = sorted([r for r in requests if r >= head])",
"    total = 0",
"    if direction == 'up':",
"        total += (right[-1] - head) if right else 0",
"        total += (right[-1] - left[-1]) if (right and left) else 0",
"    return total",
"",

function parseRows(text){
 var lines=text.trim().split(/\n/).map(function(l){return l.trim()}).filter(Boolean);
 return lines.map(function(l){return l.split(/[\s,]+/).filter(Boolean)});
}
function parseNums(text){
 return text.trim().split(/[\s,]+/).filter(Boolean).map(Number).filter(function(v){return Number.isFinite(v)});
}
function fmtNum(x,d){
 if(d===undefined)d=6;
 if(!Number.isFinite(x))return String(x);
 if(x===0)return "0";
 var a=Math.abs(x);
 if(a>=1e7||a<1e-4)return x.toExponential(Math.max(0,d-1));
 return String(parseFloat(x.toFixed(d)));
}
function padEnd(s,n){s=String(s);while(s.length<n)s+=" ";return s}
function padStart(s,n){s=String(s);while(s.length<n)s=" "+s;return s}

function demoOsScheduling(text){

 var quantum=parseInt((blocks[1]||"3").trim())||3;
 if(!rows.length)throw Error("Enter rows of 'arrival burst priority'.");
 var jobs=rows.map(function(r,i){
  return {
   id:"P"+(i+1),
   arrival:Number(r[0])||0,

  };
 });

 }
 out.push("");
 function runNonPreemptive(jobs, key){
  var S=jobs.map(function(j){return {id:j.id, arrival:j.arrival, burst:j.burst, priority:j.priority, completion:null, start:null}});
  var t=0, done=0, order=[];
  while(done<S.length){
   var avail=S.filter(function(s){return s.arrival<=t && s.completion===null});
   if(!avail.length){
    var nexts=S.filter(function(s){return s.completion===null}).map(function(s){return s.arrival});
    t=Math.min.apply(null,nexts);
    continue;
   }
   avail.sort(key);
   var p=avail[0];
   p.start=t;
   t+=p.burst;
   p.completion=t;
   order.push(p.id);
   done++;
  }
  return {S:S, order:order};
 }
 function runPreemptive(jobs, key){
  var S=jobs.map(function(j){return {id:j.id, arrival:j.arrival, burst:j.burst, priority:j.priority, remaining:j.burst, completion:null}});
  var t=0, done=0;
  var maxT=5000;
  while(done<S.length && t<maxT){
   var avail=S.filter(function(s){return s.arrival<=t && s.remaining>0});
   if(!avail.length){t++; continue}
   avail.sort(key);
   var p=avail[0];
   p.remaining--;
   t++;
   if(p.remaining===0){p.completion=t; done++}
  }
  return {S:S};
 }
 function runRR(jobs, q){
  var S=jobs.map(function(j){return {id:j.id, arrival:j.arrival, burst:j.burst, priority:j.priority, remaining:j.burst, completion:null}});
  var queue=[];
  var arrived=[];
  var t=0, done=0;
  var maxT=5000;
  function addArrivals(){
   for(var i=0;i<S.length;i++){
    if(!arrived[i] && S[i].arrival<=t){arrived[i]=true; queue.push(S[i])}
   }
  }
  addArrivals();
  while(done<S.length && t<maxT){
   if(!queue.length){t++; addArrivals(); continue}
   var p=queue.shift();
   var run=Math.min(q, p.remaining);
   p.remaining-=run;
   t+=run;
   addArrivals();
   if(p.remaining===0){p.completion=t; done++}
   else queue.push(p);

 }

   turn += s.completion - s.arrival;
  }

 }
 var results=[];

 results.push(["SJF", runNonPreemptive(jobs, function(a,b){return a.burst-b.burst||(a.id<b.id?-1:1)})]);
 results.push(["SRT", runPreemptive(jobs, function(a,b){return a.remaining-b.remaining||(a.id<b.id?-1:1)})]);
 results.push(["Priority", runNonPreemptive(jobs, function(a,b){return a.priority-b.priority||(a.id<b.id?-1:1)})]);
 results.push(["RR(q="+quantum+")", runRR(jobs, quantum)]);
 out.push(padEnd("policy",12)+padEnd("mean wait",12)+padEnd("mean turnaround",18)+"order");

function demoConcurrencyBasics(text){
