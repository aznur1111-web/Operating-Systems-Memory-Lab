function demoAllocBasics(text){
 var blocks=text.split(/\n\s*\n/);
 var sizes=parseNums(blocks[0]||"64 128 32 256 64 96 128 48");
 var ops=[];
 var opBlock=(blocks[1]||"").trim().split(/\n/);
 for(var i=0;i<opBlock.length;i++){
  var parts=opBlock[i].trim().split(/\s+/);
  if(parts.length>=2 && (parts[0]==="alloc"||parts[0]==="free")){
   ops.push({op:parts[0], val:Number(parts[1])});
  }
 }
 if(!ops.length){
  ops=[{op:"alloc",val:100},{op:"alloc",val:50},{op:"alloc",val:200},{op:"alloc",val:80}];
 }
 var out=[];
 out.push("Initial free blocks: "+sizes.join(", "));
 out.push("");
 function makeBlocks(){
  var bs=[];
  var start=0;
  for(var i=0;i<sizes.length;i++){
   bs.push({start:start, size:sizes[i], free:true});
   start+=sizes[i];
  }
  return bs;
 }
 function firstFit(blocks, req){
  for(var i=0;i<blocks.length;i++)if(blocks[i].free && blocks[i].size>=req)return i;
  return -1;
 }
 function bestFit(blocks, req){
  var best=-1, bestSize=Infinity;
  for(var i=0;i<blocks.length;i++){
   if(blocks[i].free && blocks[i].size>=req && blocks[i].size<bestSize){bestSize=blocks[i].size; best=i}
  }
  return best;
 }
 function worstFit(blocks, req){
  var best=-1, bestSize=-1;
  for(var i=0;i<blocks.length;i++){
   if(blocks[i].free && blocks[i].size>=req && blocks[i].size>bestSize){bestSize=blocks[i].size; best=i}
  }
  return best;
 }
 function coalesce(blocks){
  var merged=true;
  while(merged){
   merged=false;
   for(var i=0;i<blocks.length-1;i++){
    if(blocks[i].free && blocks[i+1].free){
     blocks[i].size+=blocks[i+1].size;
     blocks.splice(i+1,1);
     merged=true;
     break;
    }
   }
  }
 }
 for(var pi=0; pi<3; pi++){
  var policy=[firstFit, bestFit, worstFit][pi];
  var policyName=["First-fit","Best-fit","Worst-fit"][pi];
  var bs=makeBlocks();
  var log=[];
  for(var o=0;o<ops.length;o++){
   if(ops[o].op==="alloc"){
    var idx=policy(bs, ops[o].val);
    if(idx<0){log.push("alloc "+ops[o].val+" -> FAIL"); continue}
    var b=bs[idx];
    if(b.size > ops[o].val){
     var rem={start:b.start+ops[o].val, size:b.size-ops[o].val, free:true};
     b.size=ops[o].val;
     bs.splice(idx+1, 0, rem);
    }
    b.free=false;
    log.push("alloc "+ops[o].val+" -> ok at "+b.start);
   } else {
    var count=0;
    for(var i2=0;i2<bs.length;i2++){
     if(!bs[i2].free){
      if(count===ops[o].val){bs[i2].free=true; log.push("free block "+ops[o].val); break}
      count++;
     }
    }
    coalesce(bs);
   }
  }
  out.push(policyName+" simulation");
  for(var l=0;l<log.length;l++)out.push("  "+log[l]);
  var freeList=bs.filter(function(b){return b.free}).map(function(b){return b.start+":"+b.size});
  out.push("  final free list: "+freeList.join(", "));
  var freeSizes=bs.filter(function(b){return b.free}).map(function(b){return b.size});
  if(freeSizes.length){
   var largest=Math.max.apply(null,freeSizes);
   var total=freeSizes.reduce(function(a,b){return a+b},0);
   out.push("  largest free / total free = "+fmtNum(largest/total,3));
  }
  out.push("");
 }
 out.push("Fragmentation");
 out.push("  internal: block is larger than the request");
 out.push("  external: free memory is split into small blocks");
 out.push("  coalescing with boundary tags keeps external fragmentation bounded");
 return {encoded:out.join("\n"),decoded:"First-fit takes the first block that fits. Best-fit takes the smallest block that fits and leaves the smallest remainder. Worst-fit takes the largest block. Coalescing merges adjacent free blocks on free. No single policy is optimal for every workload."};
}

 out.push("  O(1) allocation and free, bounded fragmentation");

function demoPageReplacement(text){
 var blocks=text.split(/\n\s*\n/);
 var refs=parseNums(blocks[0]||"1 2 3 4 1 2 5 1 2 3 4 5");
 var frames=parseInt((blocks[1]||"3").trim())||3;
 if(!refs.length)throw Error("Enter a reference string, then a blank line, then the number of frames.");
 var out=[];
 out.push("Reference string: "+refs.join(" "));
 out.push("Frames: "+frames);
 out.push("");
 function fifo(refs, frames){
  var mem=[], faults=0, evictions=[];
  for(var i=0;i<refs.length;i++){
   var r=refs[i];
   if(mem.indexOf(r)>=0)continue;
   faults++;
   if(mem.length===frames){evictions.push(mem.shift())}
   mem.push(r);
  }
  return {faults:faults, evictions:evictions};
 }
 function lru(refs, frames){
  var mem=[], faults=0;
  for(var i=0;i<refs.length;i++){
   var r=refs[i];
   var idx=mem.indexOf(r);
   if(idx>=0){mem.splice(idx,1); mem.push(r); continue}
   faults++;
   if(mem.length===frames)mem.shift();
   mem.push(r);
  }
  return {faults:faults};
 }
 function clock(refs, frames){
  var mem=new Array(frames).fill(null);
  var refBit=new Array(frames).fill(0);
  var hand=0, faults=0;
  for(var i=0;i<refs.length;i++){
   var r=refs[i];
   var idx=mem.indexOf(r);
   if(idx>=0){refBit[idx]=1; continue}
   faults++;
   while(refBit[hand]===1){refBit[hand]=0; hand=(hand+1)%frames}
   mem[hand]=r;
   refBit[hand]=1;
   hand=(hand+1)%frames;
  }
  return {faults:faults};
 }
 function optimal(refs, frames){
  var mem=[], faults=0;
  for(var i=0;i<refs.length;i++){

function demoGarbageCollection(text){
 var blocks=text.split(/\n\s*\n/);
 var out=[];
 var roots=[], edges={}, cycles=[];
 if(blocks[0]){
  var lines=blocks[0].trim().split(/\n/);
  var rootsLine=lines[0].replace(/^roots\s*/,"").trim().split(/\s+/).filter(Boolean);
  roots=rootsLine;
  for(var i=1;i<lines.length;i++){
   var parts=lines[i].trim().split(/\s*->\s*/);
   if(parts.length===2){
    var src=parts[0].trim(), dst=parts[1].trim();
    if(!edges[src])edges[src]=[];
    edges[src].push(dst);
   }
  }
 }
 if(blocks[1]){
  cycles=blocks[1].trim().split(/\s+/).filter(Boolean);
 }
 if(!roots.length){
  roots=['R1','R2'];
  edges={'R1':['A'],'A':['B'],'B':['C'],'R2':['D'],'D':['E'],'E':['D']};
  cycles=['D','E'];
 }
 var allNodes={};
 for(var r=0;r<roots.length;r++)allNodes[roots[r]]=true;
 for(var s in edges){
  allNodes[s]=true;
  for(var j=0;j<edges[s].length;j++)allNodes[edges[s][j]]=true;
 }
 out.push("Object graph");
 out.push("  roots: "+roots.join(", "));
 for(var s2 in edges){
  out.push("  "+s2+" -> "+edges[s2].join(", "));
 }
 out.push("  total objects: "+Object.keys(allNodes).length);
 out.push("");
 var refcounts={};
 for(var k in allNodes)refcounts[k]=0;
 for(var s3 in edges){
  for(var j2=0;j2<edges[s3].length;j2++)refcounts[edges[s3][j2]]++;
 }
 for(var r2=0;r2<roots.length;r2++)refcounts[roots[r2]]++;
 out.push("Reference counting");
 out.push("  refcounts:");
 var rk=Object.keys(refcounts).sort();
 for(var i2=0;i2<rk.length;i2++){
  out.push("    "+padEnd(rk[i2],6)+refcounts[rk[i2]]);
 }
 out.push("  objects with refcount 0 are freed immediately");
 out.push("  cycles (refcount > 0 but unreachable) leak:");
 out.push("    "+cycles.join(", ")+" form a cycle and are never freed by refcount alone");
 out.push("  fix:  cycle collector or weak references");
 out.push("");
 function markSweep(roots, edges){
  var marked={};
  var stack=roots.slice();
  while(stack.length){
   var n=stack.pop();
   if(marked[n])continue;
   marked[n]=true;
   var nbrs=edges[n]||[];
   for(var i=0;i<nbrs.length;i++)stack.push(nbrs[i]);
  }
  var garbage=[];
  for(var n2 in allNodes)if(!marked[n2])garbage.push(n2);
  return {marked:Object.keys(marked), garbage:garbage};
 }
 var ms=markSweep(roots, edges);
 out.push("Mark-sweep");
 out.push("  marked:  "+ms.marked.sort().join(", "));
 out.push("  garbage: "+ms.garbage.sort().join(", "));
 out.push("  the mark phase is O(live set), the sweep is O(heap)");
 out.push("");
 function cheney(roots, edges){
  var to=[];
  var queue=roots.slice();
  var seen={};
  while(queue.length){
   var n=queue.shift();
   if(seen[n])continue;
   seen[n]=true;
   to.push(n);
   var nbrs=edges[n]||[];
   for(var i=0;i<nbrs.length;i++)queue.push(nbrs[i]);
  }
  return to;
 }
 var copy=cheney(roots, edges);
 out.push("Copying collector (Cheney)");
 out.push("  survivors copied to the to-space: "+copy.join(", "));
 out.push("  cost is proportional to the live set, not the heap");
 out.push("  uses 2x memory (two semispaces)");
 out.push("");
 out.push("Generational GC");
 out.push("  weak generational hypothesis: most objects die young");
 out.push("  young gen: minor GC, frequent, small");
 out.push("  old gen: major GC, rare, large");
 out.push("  promotion: objects that survive a few minor GCs move to the old gen");
 out.push("  write barrier: track old-to-young pointers");
 return {encoded:out.join("\n"),decoded:"Reference counting frees an object when its count drops to zero but cannot collect cycles. Mark-sweep traces from the roots and frees the unreachable objects. Copying collectors move live objects and leave the garbage behind. Generational collectors exploit the fact that most objects die young."};
}

function demoIoScheduling(text){
 var rows=parseRows(text);
 var out=[];
 var head=null, end=null;
 var requests=[];
 for(var i=0;i<rows.length;i++){
  var r=rows[i];
  if(r.length===1 && !isNaN(Number(r[0]))){
   if(head===null) head=Number(r[0]);
   else if(requests.length) end=Number(r[0]);
  } else if(r.length>0){
   for(var j=0;j<r.length;j++){
    var v=Number(r[j]);
    if(!isNaN(v))requests.push(v);
   }
  }
 }
 if(head===null) head=53;
 if(end===null) end=200;
 if(!requests.length){
  head=53;
  requests=[98,183,37,122,14,124,65,67];
  end=200;
 }
 out.push("Requests: "+requests.join(", "));
 out.push("Initial head: "+head);
 out.push("Disk end: "+end);
 out.push("");
 function fcfs(reqs, h){
  var total=0, cur=h;
  for(var i=0;i<reqs.length;i++){total+=Math.abs(reqs[i]-cur); cur=reqs[i]}
  return total;
 }
 function sstf(reqs, h){
  var rem=reqs.slice();
  var total=0, cur=h;
  while(rem.length){
   var best=0;
   for(var i=1;i<rem.length;i++)if(Math.abs(rem[i]-cur)<Math.abs(rem[best]-cur))best=i;
   total+=Math.abs(rem[best]-cur);
   cur=rem[best];
   rem.splice(best,1);
  }
  return total;
 }
 function scan(reqs, h, direction){
  var left=reqs.filter(function(r){return r<h}).sort(function(a,b){return b-a});
  var right=reqs.filter(function(r){return r>=h}).sort(function(a,b){return a-b});
  var total=0, cur=h;
  if(direction==="up"){
   for(var i=0;i<right.length;i++){total+=Math.abs(right[i]-cur); cur=right[i]}
   if(left.length){total+=Math.abs(end-cur); cur=end; for(var i2=0;i2<left.length;i2++){total+=Math.abs(left[i2]-cur); cur=left[i2]}}
  } else {
   for(var i3=0;i3<left.length;i3++){total+=Math.abs(left[i3]-cur); cur=left[i3]}
   if(right.length){total+=Math.abs(0-cur); cur=0; for(var i4=0;i4<right.length;i4++){total+=Math.abs(right[i4]-cur); cur=right[i4]}}
  }
  return total;
 }
 function cscan(reqs, h){
  var left=reqs.filter(function(r){return r<h}).sort(function(a,b){return b-a});
  var right=reqs.filter(function(r){return r>=h}).sort(function(a,b){return a-b});
  var total=0, cur=h;
  for(var i=0;i<right.length;i++){total+=Math.abs(right[i]-cur); cur=right[i]}
  total+=Math.abs(end-cur); cur=end;
  total+=Math.abs(end-0); cur=0;
  for(var i2=0;i2<left.length;i2++){total+=Math.abs(left[i2]-cur); cur=left[i2]}
  return total;
 }
 function look(reqs, h, direction){
  var left=reqs.filter(function(r){return r<h}).sort(function(a,b){return b-a});
  var right=reqs.filter(function(r){return r>=h}).sort(function(a,b){return a-b});
  var total=0, cur=h;
  if(direction==="up"){
   for(var i=0;i<right.length;i++){total+=Math.abs(right[i]-cur); cur=right[i]}
   for(var i2=0;i2<left.length;i2++){total+=Math.abs(left[i2]-cur); cur=left[i2]}
  } else {
   for(var i3=0;i3<left.length;i3++){total+=Math.abs(left[i3]-cur); cur=left[i3]}
   for(var i4=0;i4<right.length;i4++){total+=Math.abs(right[i4]-cur); cur=right[i4]}
  }
  return total;
 }
 out.push(padEnd("policy",14)+"total head movement");
 out.push(padEnd("FCFS",14)+fcfs(requests, head));
 out.push(padEnd("SSTF",14)+sstf(requests, head));
 out.push(padEnd("SCAN up",14)+scan(requests, head, "up"));
 out.push(padEnd("SCAN down",14)+scan(requests, head, "down"));
 out.push(padEnd("C-SCAN",14)+cscan(requests, head));
 out.push(padEnd("LOOK up",14)+look(requests, head, "up"));
 out.push(padEnd("LOOK down",14)+look(requests, head, "down"));
 out.push("");
 out.push("FCFS: fair, poor throughput");
 out.push("SSTF: minimizes the next seek, can starve far requests");
 out.push("SCAN: sweeps to the end, reverses, no starvation");
 out.push("C-SCAN: sweeps one direction, jumps back, uniform wait");
 out.push("LOOK / C-LOOK: stop at the last request, less travel");
 out.push("");
 out.push("DMA moves data without the CPU. Interrupt-driven I/O notifies on completion.");

}

function getChapter(id){
 for(var i=0;i<CHAPTERS.length;i++)if(CHAPTERS[i].ids.indexOf(id)>=0)return CHAPTERS[i];
 return CHAPTERS[0];
}
function completedCount(){return Object.keys(state.completed).length}
function progress(){
 var n=completedCount(),t=LESSONS.length;
 $("#progressText").textContent=n+" / "+t;
 $("#progressFill").style.width=(n/t*100)+"%";
 $("#lessonCount").textContent=t+" lessons";
 $("#catalogCount").textContent=CHAPTERS.length+" chapters · "+t+" lessons · "+LESSONS.filter(function(l){return l.demo&&l.demo!=="none"}).length+" labs";
}
function renderTree(){
 var q=($("#searchInput").value||"").toLowerCase().trim();
 var ch=$("#chapterFilter").value;
 var root=$("#courseTree");
 root.textContent="";
 var any=false;
 for(var ci=0;ci<CHAPTERS.length;ci++){
  var c=CHAPTERS[ci];
  if(ch!=="all"&&c.id!==ch)continue;
  var rows=[];
  for(var i=0;i<c.ids.length;i++){
   var l=byId[c.ids[i]];
   if(!l)continue;
   if(q){
    var hay=(l.title+" "+l.summary+" "+l.kind+" "+c.title).toLowerCase();
    if(hay.indexOf(q)<0)continue;
   }
   rows.push(l);
  }
  if(!rows.length)continue;
  any=true;
  var group=document.createElement("section");
  var label=document.createElement("div");label.className="group-label";
  label.innerHTML="<span>"+esc(c.title)+"</span><span>"+rows.length+"</span>";
  group.appendChild(label);
  for(var i2=0;i2<rows.length;i2++){
   var l2=rows[i2];
   var b=document.createElement("button");b.type="button";
   b.className="link"+(state.current===l2.id?" active":"");
   b.dataset.lesson=l2.id;
   var idx=LESSONS.indexOf(l2);
   b.innerHTML='<span class="num">'+String(idx+1).padStart(2,"0")+'</span><span class="name">'+esc(l2.title)+'</span>'+(state.completed[l2.id]?'<span class="done">✓</span>':'');
   group.appendChild(b);
  }
  root.appendChild(group);
 }
 if(!any)root.innerHTML='<p class="muted">No matching lessons. Try another search.</p>';
 progress();
}
function listToHTML(a){
 return '<ol class="steps">'+a.map(function(x){return "<li>"+esc(x)+"</li>"}).join("")+"</ol>";
}
function refsHTML(r){
 if(!r||!r.length)return '<p class="muted">See the recommended textbooks and papers for a full treatment.</p>';
 return '<div class="references">'+r.map(function(x){return '<a target="_blank" rel="noopener noreferrer" href="'+esc(x[1])+'">'+esc(x[0])+' ↗</a>'}).join("")+"</div>";
}
function codeText(l){
 var c=CODE[l.id];
 if(c)return c;
 return "# CONCEPT OUTLINE, NOT EXECUTABLE PYTHON\n# Lesson: "+l.title+"\n\n# Core idea\n# "+String(l.summary||"").replace(/\n/g,"\n# ")+"\n\n# Pseudocode from the lesson\n"+String(l.pseudo||"").split("\n").map(function(x){return "# "+x}).join("\n")+"\n";
}
function statusClass(l){return /Runnable/.test(l.status)?"good":"warn"}

function renderLesson(id){
 var l=byId[id];
 if(!l){renderHome();return}
 state.page="lesson";state.current=id;
 var c=getChapter(id);
 var index=LESSONS.indexOf(l);
 var next=LESSONS[(index+1)%LESSONS.length];
 var hasDemo=l.demo&&l.demo!=="none";
 var demoArea="";
 if(hasDemo){
  demoArea=
   '<section class="panel"><div class="panel-head"><h2>'+esc(l.demoTitle||"Interactive teaching lab")+'</h2><p>Everything runs in your browser with plain JavaScript. This is a teaching implementation, not a production kernel or runtime.</p></div><div class="body"><div class="lab-top"><label for="labInput">Input</label><button class="btn" id="resetSample">Reset sample</button><button class="btn primary" id="runLab">Run lab</button></div><textarea class="lab-input" id="labInput" aria-label="Lab input">'+esc(l.sample||"")+'</textarea><div class="notice info"><strong>Format:</strong> see the sample for the expected format. Each lab parses the textarea with whitespace-separated fields. Blank lines separate blocks.</div><div class="lab-cols"><div><div class="label">Output</div><div class="lab-output" id="labEncoded">Run the lab to see output.</div></div><div><div class="label">Explanation</div><div class="lab-output" id="labDecoded">Step notes appear here.</div></div></div></div></section>';
 }
 var references=refsHTML(l.refs);
 var code=state.drafts[id]!==undefined?state.drafts[id]:codeText(l);
 var html="";
 html+='<div class="breadcrumb">Operating Systems &amp; Memory / '+esc(c.title)+"</div>";
 html+='<header class="header">';
 html+=' <div class="eyebrow">LESSON '+String(index+1).padStart(2,"0")+" · "+esc(l.kind)+"</div>";
 html+=" <h1>"+esc(l.title)+"</h1>";
 html+=" <p>"+esc(l.summary)+"</p>";
 html+=' <div class="tags"><span class="tag">Level '+l.level+'</span><span class="tag '+statusClass(l)+'">'+esc(l.status)+'</span><span class="tag">'+esc(c.title.replace(/^\d+(\.\d+)?\.?\s*/,""))+"</span></div>";
 html+=' <div class="header-actions">';
 html+='  <button class="btn" id="bookmarkBtn">'+(state.bookmarks[id]?"★ Bookmarked":"☆ Bookmark")+"</button>";
 html+='  <button class="btn primary" id="completeBtn">'+(state.completed[id]?"✓ Completed":"Mark complete")+"</button>";
 html+=" </div>";
 html+="</header>";
 html+='<section class="panel"><div class="panel-head"><h2>1. Understand the idea</h2><p>Plain language and a mental picture</p></div><div class="body idea"><div><p>'+esc(l.summary)+'</p><p><strong>What problem it solves:</strong> '+esc(l.problem)+'</p><div class="takeaway"><strong>Takeaway:</strong> '+esc(l.output)+'</div></div><aside class="mental"><small>Mental picture</small><strong>'+esc(l.mental)+"</strong><p>"+esc(l.mentalText)+"</p></aside></div></section>";
 html+='<section class="panel"><div class="panel-head"><h2>2. Input and output</h2><p>Know what goes in and what comes out</p></div><div class="body two"><div class="mini"><h3>Input</h3><p>'+esc(l.input)+'</p></div><div class="mini"><h3>Output</h3><p>'+esc(l.output)+"</p></div></div></section>";
 html+='<section class="panel"><div class="panel-head"><h2>3. How it works</h2><p>Step by step, with the key rule that makes it correct</p></div><div class="body two"><div>'+listToHTML(l.steps)+'<div class="takeaway" style="margin-top:14px"><strong>Key rule:</strong> '+esc(l.invariant)+'</div></div><pre class="pseudo">'+esc(l.pseudo)+"</pre></div>";
 html+='<div class="table-wrap" style="margin-top:16px"><table><thead><tr><th>Step</th><th>What happens</th><th>Why it matters</th></tr></thead><tbody>';
 for(var ti=0;ti<l.trace.length;ti++){
  var row=l.trace[ti];
  html+="<tr>"+row.map(function(v){return "<td>"+esc(v)+"</td>"}).join("")+"</tr>";
 }
 html+="</tbody></table></div></section>";
 html+=demoArea;
 html+='<section class="panel"><div class="panel-head"><h2>4. Cost and behavior</h2><p>Costs depend on the workload, the hardware and the concurrency level.</p></div><div class="body"><div class="tiles">';
 var tileLabels=["Time","Space","Trade-off"];
 for(var ci2=0;ci2<l.complexity.length;ci2++){
  var x=l.complexity[ci2];
  var short=x.split(" ").slice(0,2).join(" ");
  html+='<div class="tile"><span>'+tileLabels[ci2]+"</span><strong>"+esc(short)+"</strong><small>"+esc(x)+"</small></div>";
 }
 html+='</div><div class="two" style="margin-top:12px"><div class="mini"><h3>Strengths</h3><p>'+esc(l.strength)+'</p></div><div class="mini"><h3>Limits</h3><p>'+esc(l.limits)+"</p></div></div></div></section>";
 html+='<section class="panel"><div class="panel-head"><h2>5. Code and usage</h2><p>Reference code is for learning. Real systems use a vetted kernel or runtime.</p></div><div class="code-head"><div><span class="tag">'+(CODE[id]?"Python example":"Concept outline, not executable")+'</span> <span class="tag">Editable</span></div><div class="header-actions" style="margin:0"><button class="btn" id="copyCode">Copy code</button><button class="btn" id="downloadCode">Download</button></div></div><textarea id="codeEditor" class="code-editor" spellcheck="false" aria-label="Editable Python code">'+esc(code)+'</textarea><div class="code-foot"><span>'+(CODE[id]?"Reference example. The in-page lab runs its own JavaScript implementation.":"Lesson-specific outline, not an implementation.")+'</span><span id="codeStatus">Local draft</span></div><div class="body"><div class="mini"><h3>Where it is used</h3><p>'+esc(l.uses)+'</p></div><div class="notice" style="margin-top:12px"><strong>Common pitfall:</strong> '+esc(l.pitfall)+"</div></div></section>";
 html+='<section class="panel"><div class="panel-head"><h2>6. Choices and alternatives</h2><p>Pick based on the workload, the hardware and the guarantees you need</p></div><div class="body two"><div class="mini"><h3>When to use this</h3><p>'+esc(l.strength)+'</p></div><div class="mini"><h3>When to use something else</h3><p>'+esc(l.limits)+"</p></div></div></section>";
 html+='<section class="panel"><div class="panel-head"><h2>7. Check yourself</h2><p>Try to answer before you open the explanation</p></div><div class="body"><details class="practice"><summary>'+esc(l.question)+"</summary><p>"+esc(l.answer)+"</p></details></div></section>";
 html+='<section class="panel"><div class="panel-head"><h2>8. References</h2><p>Standard references for this topic</p></div><div class="body">'+references+'<p class="muted" style="font-size:11.5px;margin-top:14px">The labs on this page are teaching implementations. For production work use a real OS kernel (Linux, FreeBSD, Windows), a real runtime (HotSpot, .NET, Go), or the actual hardware manuals (Intel SDM, ARM ARM) for the memory-ordering details.</p></div></section>';
 html+='<footer class="footer"><span>Az Operating Systems &amp; Memory Lab · local learning</span><span>Lesson '+(index+1)+" of "+LESSONS.length+" · Next: "+esc(next.title)+'</span><button class="btn" id="nextLesson">Next →</button></footer>';
 $("#mainView").innerHTML=html;

 $("#bookmarkBtn").onclick=function(){
  if(state.bookmarks[id])delete state.bookmarks[id];else state.bookmarks[id]=true;
  save();renderLesson(id);
  toast(state.bookmarks[id]?"Bookmarked":"Bookmark removed");
 };
 $("#completeBtn").onclick=function(){
  if(state.completed[id])delete state.completed[id];else state.completed[id]=true;
  save();renderTree();renderLesson(id);
  toast(state.completed[id]?"Lesson completed":"Completion removed");
 };
 $("#nextLesson").onclick=function(){openLesson(next.id)};
 $("#copyCode").onclick=function(){
  var v=$("#codeEditor").value;
  function fallbackCopy(vv){
   var ta=$("#codeEditor");ta.select();
   try{document.execCommand("copy");toast("Code copied")}catch(e){toast("Copy failed")}
  }
  try{
   if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(v).then(function(){toast("Code copied")},function(){fallbackCopy(v)});
   } else fallbackCopy(v);
  }catch(e){fallbackCopy(v)}
 };
 $("#downloadCode").onclick=function(){
  downloadText(id+".py",$("#codeEditor").value,"text/x-python");
 };
 $("#codeEditor").addEventListener("input",function(){
  state.drafts[id]=$("#codeEditor").value;
  save();
  $("#codeStatus").textContent="Draft saved locally";
 });
 if(hasDemo){
  $("#runLab").onclick=function(){runLab(l)};
  $("#resetSample").onclick=function(){
   $("#labInput").value=l.sample||"";
   $("#labEncoded").textContent="Run the lab to see output.";
   $("#labDecoded").textContent="Step notes appear here.";
  };
  runLab(l,true);
 }
 renderTree();save();
 if(location.hash!=="#"+id)history.replaceState(null,"","#"+id);
}

function renderHome(){
 state.page="home";
 var html="";
 html+='<div class="home-hero"><div class="eyebrow">AZ · ENGINEERING TOOLBOOK</div><h1>Understand operating systems and memory from processes and syscalls to NUMA and lock-free allocation.</h1><p>A hands-on course on OS internals: processes and threads, scheduling, concurrency and mutual exclusion, deadlocks, memory allocation, kernel allocators, virtual memory, page replacement, protection, garbage collection, modern collectors, I/O scheduling and advanced systems memory. Every lesson has a plain explanation and a runnable lab that runs entirely in the browser.</p><div class="header-actions" style="margin:0"><button class="btn primary" id="startFirst">Start at OS foundations</button><button class="btn" id="resumeLesson">Continue lesson</button></div></div>';
 html+='<div class="stats"><div class="stat"><strong>'+CHAPTERS.length+'</strong><span>chapters</span></div><div class="stat"><strong>'+LESSONS.length+'</strong><span>lessons</span></div><div class="stat"><strong>'+LESSONS.filter(function(l){return l.demo&&l.demo!=="none"}).length+'</strong><span>runnable labs</span></div><div class="stat"><strong>1</strong><span>standalone HTML file</span></div></div>';
 html+='<section class="panel"><div class="panel-head"><h2>Honest scope</h2><p>One file covers the whole OS and memory curriculum. Production systems are a separate engineering project.</p></div><div class="body two"><div class="mini"><h3>What runs here</h3><p>Process and syscall timelines, FCFS/SJF/SRT/RR/priority scheduling, mutex and semaphore simulation, Peterson and bakery and ticket locks, Banker\'s algorithm, first-fit/best-fit/worst-fit, buddy and slab allocators, page-table walks and TLB cost, FIFO/LRU/Clock/Optimal page replacement with Belady\'s anomaly, COW and mmap and ASLR, reference counting and mark-sweep and copying GC, G1 and ZGC region simulation, SSTF/SCAN/C-SCAN I/O scheduling, and NUMA and false-sharing and memory-ordering analysis.</p></div><div class="mini"><h3>What does not run here</h3><p>A real kernel, a real CPU, a real page-table walker, a production garbage collector, a real disk driver and the actual hardware memory model. Those need Linux or FreeBSD source, the Intel SDM and ARM ARM, HotSpot or .NET, and a profiling tool like perf or VTune.</p></div></div></section>';
 html+='<div class="panel"><div class="panel-head"><h2>Course map</h2><p>Pick a chapter. The path runs from OS foundations to advanced systems memory.</p></div><div class="body"><div class="chapter-cards">';
 for(var i=0;i<CHAPTERS.length;i++){
  var c=CHAPTERS[i];
  html+='<button class="chapter-card" data-chapter="'+c.id+'"><span class="num">CHAPTER '+String(i+1).padStart(2,"0")+" · "+c.ids.length+" LESSON"+(c.ids.length>1?"S":"")+"</span><strong>"+esc(c.title.replace(/^\d+(\.\d+)?\.?\s*/,""))+"</strong><p>"+esc(c.desc)+"</p></button>";
 }
 html+="</div></div></div>";
 html+='<footer class="footer"><span>Az Operating Systems &amp; Memory Lab</span><span>Single file · no external runtime dependencies</span></footer>';
 $("#mainView").innerHTML=html;
 $("#startFirst").onclick=function(){openLesson("os-foundations")};
 $("#resumeLesson").onclick=function(){
  var id=state.current&&byId[state.current]?state.current:"os-foundations";
  openLesson(id);
 };
 var cards=$("#mainView").querySelectorAll("[data-chapter]");
 for(var ci=0;ci<cards.length;ci++){
  cards[ci].onclick=(function(cid){
   return function(){
    for(var k=0;k<CHAPTERS.length;k++)if(CHAPTERS[k].id===cid)return openLesson(CHAPTERS[k].ids[0]);
   };
  })(cards[ci].dataset.chapter);
 }
}

function renderProgressPage(){
 state.page="progress";
 var completedIds=Object.keys(state.completed);
 var bookmarkIds=Object.keys(state.bookmarks);
 var html="";
 html+='<div class="breadcrumb">OS Lab / Bookmarks &amp; progress</div><header class="header"><div class="eyebrow">LOCAL ONLY</div><h1>Bookmarks and progress</h1><p>Your progress stays in this browser. Export the JSON to move it or keep a backup.</p></header>';
 html+='<section class="panel"><div class="panel-head"><h2>Completed lessons</h2></div><div class="body">';
 if(completedIds.length){
  html+='<div class="references">'+completedIds.map(function(id){return '<a href="#'+id+'" data-open="'+id+'">'+esc(byId[id].title)+"</a>"}).join("")+"</div>";
 } else html+='<p class="muted">No lessons marked complete yet.</p>';
 html+="</div></section>";
 html+='<section class="panel"><div class="panel-head"><h2>Bookmarks</h2></div><div class="body">';
 if(bookmarkIds.length){
  html+='<div class="references">'+bookmarkIds.map(function(id){return '<a href="#'+id+'" data-open="'+id+'">'+esc(byId[id].title)+"</a>"}).join("")+"</div>";
 } else html+='<p class="muted">No bookmarks yet.</p>';
 html+="</div></section>";
 html+='<section class="panel"><div class="panel-head"><h2>Progress data</h2></div><div class="body"><div class="header-actions" style="margin:0"><button class="btn primary" id="exportProgress">Export progress JSON</button><button class="btn" id="clearProgress">Clear completion marks</button></div><p class="muted" style="font-size:12.5px;margin-top:14px">Import accepts only known lesson IDs and a supported schema version.</p></div></section>';
 $("#mainView").innerHTML=html;
 var links=$("#mainView").querySelectorAll("[data-open]");
 for(var i=0;i<links.length;i++){
  links[i].onclick=(function(id){
   return function(e){e.preventDefault();openLesson(id)};
  })(links[i].dataset.open);
 }
 $("#exportProgress").onclick=exportProgress;
 $("#clearProgress").onclick=function(){
  if(confirm("Clear all completion marks?")){
   state.completed={};
   save();renderProgressPage();renderTree();
   toast("Completion marks cleared");
  }
 };
}

function openLesson(id){
 if(!byId[id])return;
 renderLesson(id);
 renderTree();
 var mv=$("#mainView");
 if(mv.focus)mv.focus({preventScroll:true});
 window.scrollTo(0,0);
}
function downloadText(name,text,type){
 type=type||"text/plain";
 var blob=new Blob([text],{type:type});
 var url=URL.createObjectURL(blob);
 var a=document.createElement("a");
 a.href=url;a.download=name;
 document.body.appendChild(a);
 a.click();
 a.remove();
 setTimeout(function(){URL.revokeObjectURL(url)},800);
}
function exportProgress(){
 var data={
  schemaVersion:1,
  completed:Object.keys(state.completed),
  bookmarks:Object.keys(state.bookmarks),
  theme:state.theme,
  current:state.current,
  drafts:state.drafts
 };
 downloadText("az-os-lab-progress.json",JSON.stringify(data,null,2),"application/json");
 toast("Progress exported");
}
function importProgressFile(file){
 if(file.size>2000000){toast("Import rejected: file too large");return}
 var r=new FileReader();
 r.onload=function(){
  try{
   var d=JSON.parse(r.result);
   if(!d||d.schemaVersion!==1)throw Error("bad schema");
   if(!Array.isArray(d.completed)||!Array.isArray(d.bookmarks)||typeof d.drafts!=="object")throw Error("bad schema");
   var bad=false;
   d.completed.concat(d.bookmarks).forEach(function(id){if(typeof id!=="string"||!byId[id])bad=true});
   if(bad)throw Error("unknown id");
   state.completed={};
   state.bookmarks={};
   d.completed.forEach(function(id){state.completed[id]=true});
   d.bookmarks.forEach(function(id){state.bookmarks[id]=true});
   if(["system","light","dark"].indexOf(d.theme)>=0)state.theme=d.theme;
   state.current=byId[d.current]?d.current:null;
   state.drafts={};
   Object.keys(d.drafts).forEach(function(k){
    if(byId[k]&&typeof d.drafts[k]==="string"&&d.drafts[k].length<100000)state.drafts[k]=d.drafts[k];
   });
   applyTheme();save();renderTree();
   if(state.current)openLesson(state.current);else renderHome();
   toast("Progress imported");
  }catch(e){toast("Import rejected: invalid progress data")}
 };
 r.readAsText(file);
}

function bindGlobal(){
 $("#themeSelect").onchange=function(){state.theme=$("#themeSelect").value;applyTheme();save()};
 $("#printBtn").onclick=function(){window.print()};
 $("#exportBtn").onclick=exportProgress;
 $("#importBtn").onclick=function(){$("#importFile").click()};
 $("#importFile").onchange=function(e){
  if(e.target.files&&e.target.files[0])importProgressFile(e.target.files[0]);
  e.target.value="";
 };
 $("#searchInput").oninput=renderTree;
 $("#chapterFilter").onchange=renderTree;
 $("#homeLink").onclick=function(e){e.preventDefault();renderHome();history.replaceState(null,"","#home")};
 $("#courseTree").onclick=function(e){
  var b=e.target.closest?e.target.closest("[data-lesson]"):null;
  if(b)openLesson(b.dataset.lesson);
 };
 var homeBtns=document.querySelectorAll('[data-page="home"]');
 for(var i=0;i<homeBtns.length;i++)homeBtns[i].onclick=renderHome;
 var progressBtns=document.querySelectorAll('[data-page="progress"]');
 for(var j=0;j<progressBtns.length;j++)progressBtns[j].onclick=renderProgressPage;
 document.addEventListener("keydown",function(e){
  var tag=document.activeElement.tagName;
  if(e.key==="/"&&["INPUT","TEXTAREA","SELECT"].indexOf(tag)<0){
   e.preventDefault();$("#searchInput").focus();
  }
  if(e.key.toLowerCase()==="t"&&["INPUT","TEXTAREA","SELECT"].indexOf(tag)<0){
   state.theme=state.theme==="dark"?"light":state.theme==="light"?"system":"dark";
   applyTheme();save();
  }
 });
}

function init(){
 try{
  load();
  applyTheme();
  for(var ci=0;ci<CHAPTERS.length;ci++){
   var op=document.createElement("option");
   op.value=CHAPTERS[ci].id;
   op.textContent=CHAPTERS[ci].title;
   $("#chapterFilter").appendChild(op);
  }
  bindGlobal();
  renderTree();
  var hash=location.hash.replace(/^#/,"");
  if(hash&&byId[hash])renderLesson(hash);
  else if(state.current&&byId[state.current])renderLesson(state.current);
  else renderHome();
  progress();
 }catch(e){
  var mv=document.getElementById("mainView");
  if(mv)mv.innerHTML='<div style="padding:20px;color:#ff929e"><h2>Initialization error</h2><pre>'+String(e&&e.stack||e)+"</pre></div>";
  if(window.console)console.error(e);
 }
}
init();
</script></body></html>
